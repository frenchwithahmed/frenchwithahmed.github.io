<style>
:root{
  --ink:#0e0e0e; --blue:#0055A4; --blue2:#1f6fc9; --red:#EF4135;
  --flag-solid:linear-gradient(90deg,#0055A4 0 33.34%,#ffffff 33.34% 66.67%,#EF4135 66.67%);
  --flag-card:linear-gradient(90deg,#0055A4 0 33.34%,#dfe6f5 33.34% 66.67%,#EF4135 66.67%); --bg:#f3f5fb; --card:#fff;
  --text:#1c2333; --muted:#6b7385; --line:#e3e7f1; --ok:#1e9e5a; --bad:#d6334a; --warn:#e8890c;
  --r:20px; --shadow:0 2px 14px rgba(31,58,147,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Cairo","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;background:linear-gradient(115deg,#e3edfb 0%,#f6f9ff 32%,#ffffff 50%,#fff6f5 68%,#fde6e3 100%) fixed;color:var(--text);line-height:1.6;min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
button:disabled{opacity:.55;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.i.s{width:16px;height:16px}
.tricolor{height:8px;background:var(--flag-solid)}

/* header */
header{background:var(--ink);border-bottom:1px solid #262626;position:sticky;top:0;z-index:40}
.bar{max-width:1240px;margin:auto;padding:8px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center}
.brand img{height:60px;width:auto;display:block}
nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;padding:9px 15px;border-radius:12px;color:#b4b9c7;font-weight:600;font-size:14px;transition:.2s;display:flex;align-items:center;gap:8px;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:rgba(255,255,255,.15);color:#fff}
.tbtn{background:var(--blue2);color:#fff;padding:9px 18px;border-radius:12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tbtn.out{background:transparent;color:#ff8a93;border:1px solid #ff8a93}
.tbar{background:#fff7e6;border-bottom:1px solid #ffe2a8;padding:8px 24px;font-size:13px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.tbar button{background:#fff;border:1px solid #f0c978;color:#8a5a00;padding:5px 12px;border-radius:9px;font-size:12.5px;font-weight:700}
@media(max-width:820px){nav{order:3;width:100%;flex:none}.brand img{height:52px}}

main{max-width:1240px;margin:auto;padding:30px 24px 80px}

/* hero */
.hero{background:radial-gradient(800px 380px at 15% -10%,rgba(255,255,255,.18),transparent 60%),linear-gradient(135deg,#00265a 0%,#0055A4 58%,#1f6fc9 100%);color:#fff;border-radius:28px;padding:50px 44px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;position:relative;overflow:hidden}
.eyebrow{display:inline-block;background:rgba(255,255,255,.14);padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:14px}
.hero h1{font-size:40px;line-height:1.25;font-weight:800;margin-bottom:12px}
.hero h1 em{font-style:normal;color:#ffd166}
.hero p{opacity:.9;max-width:520px;font-size:16px}
.cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.cbtn{background:#fff;color:var(--blue);padding:12px 24px;border-radius:14px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.cbtn.ghost{background:rgba(255,255,255,.14);color:#fff}
.words{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;direction:ltr}
.words span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:10px 20px;border-radius:16px;font-weight:700;font-size:20px;backdrop-filter:blur(4px)}
.words span:nth-child(2n){transform:translateY(12px);background:rgba(255,255,255,.24)}
.words span:nth-child(3n){background:rgba(239,65,53,.45)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding:34px 24px}.hero h1{font-size:30px}.words{display:none}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:22px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;text-align:right;transition:.25s;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(31,58,147,.12)}
.tile .ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.tile b{display:block;font-size:22px;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.c-blue{background:#e9eefc;color:var(--blue)}.c-red{background:#fde8ea;color:var(--red)}
.c-purple{background:#efe7ff;color:#7a3cf0}.c-green{background:#e3f7ec;color:var(--ok)}
.c-orange{background:#fff0dc;color:var(--warn)}.c-teal{background:#dff6f6;color:#0c8d94}

h2.st{font-size:22px;margin:38px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:800}
h2.st small{font-size:14px;color:var(--muted);font-weight:600}
h2.st .i{color:var(--blue2);margin-left:8px}
.more{background:none;color:var(--blue2);font-weight:700;font-size:14px}

/* upcoming */
.up{display:grid;gap:10px}
.upi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:14px}
.upi .ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.upi div.t{flex:1}
.upi b{display:block}
.upi small{color:var(--muted)}
.upi .left{font-weight:800;color:var(--warn);font-size:13px;white-space:nowrap}

/* toolbar */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.sbox{flex:1;min-width:210px;position:relative}
.sbox .i{position:absolute;top:50%;right:14px;transform:translateY(-50%);color:var(--muted)}
.sbox input{width:100%;padding:11px 42px 11px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.add{background:var(--red);color:#fff;padding:11px 20px;border-radius:14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}
.card{background:var(--flag-card) top/100% 4px no-repeat, var(--card);border-radius:var(--r);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px;transition:.25s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(31,58,147,.12)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.lv{font-size:12px;font-weight:800;padding:3px 11px;border-radius:999px;background:#e9eefc;color:var(--blue);direction:ltr;white-space:nowrap}
.card h3{font-size:17px;line-height:1.4}
.card p{font-size:13.5px;color:var(--muted);flex:1}
.meta{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:9px;background:var(--bg);color:#4a5268}

.empty{text-align:center;padding:54px 20px;color:var(--muted);background:#fff;border:2px dashed var(--line);border-radius:var(--r)}
.empty .eic{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px}

.errbox{background:#fde8ea;color:var(--bad);padding:14px 18px;border-radius:14px;margin-bottom:18px;font-size:14px}
.setup{max-width:640px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;text-align:center}

.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* link card */
.lcard{flex-direction:row;align-items:flex-start;gap:14px;text-decoration:none}
.lcard img{width:44px;height:44px;border-radius:12px;background:var(--bg);padding:6px;flex-shrink:0}
.lcard .b{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.lcard .host{direction:ltr;text-align:right;font-size:12px;color:var(--blue2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* video */
.vcard{padding:0;overflow:hidden}
.vwrap{aspect-ratio:16/9;background:#000}
.vwrap video,.vwrap iframe{width:100%;height:100%;border:0;display:block}

.modal{background:var(--flag-card) top/100% 6px no-repeat, #fff;border-radius:24px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:28px;position:relative;margin:auto}

.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0B1F3A,#B8893B)}
.pbar.low i{background:#c0392b}
tr.rowopen{cursor:pointer}

footer .fl{font-size:15px;margin-bottom:4px;direction:ltr}footer .fl b{letter-spacing:.14em;color:#fff}footer .fl .by{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--gold-soft)}footer .fs{direction:ltr;font-size:12.5px}
.lghead{display:flex;align-items:center;gap:14px;background:var(--navy);margin:-28px -28px 20px;padding:18px 26px 18px 66px;direction:ltr}
.lghead img{height:46px}.lghead span{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--gold-soft);font-size:18px;line-height:1.3;border-inline-start:1px solid var(--gold);padding-inline-start:14px}.lghead small{font-family:Cairo,sans-serif;font-style:normal;font-size:11.5px;color:#c3cbdb}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}header :focus-visible,footer :focus-visible{outline-color:var(--gold-soft)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(max-width:520px){.brand{gap:10px}.brand img{height:44px}.brand .by{padding-inline-start:10px}.brand .by i{display:none}.brand .by b{font-size:15px}}

/* ===== المرحلة ب: تنقل الجوال (v7b) ===== */
#bnav{display:none}
.moregrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.moregrid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 8px;background:var(--ivory);border:1px solid var(--line);border-radius:16px;font-weight:700;font-size:15px;color:var(--navy);min-height:92px;justify-content:center}
.moregrid button:active{background:var(--blue-soft,#E6EEF8)}.moregrid .i{width:28px;height:28px;color:var(--blue)}
@media(max-width:820px){
  nav#nav{display:none}
  .bar{flex-wrap:nowrap;justify-content:space-between;padding:8px 16px}
  #auth{display:flex;align-items:center;gap:8px}.who{display:none}
  #bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);z-index:45;padding:6px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(11,31,58,.08)}
  #bnav button{background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 2px;min-height:54px;border-radius:12px;position:relative}
  #bnav button .i{width:23px;height:23px}
  #bnav button.on{color:var(--blue)}
  #bnav button.on::after{content:"";position:absolute;bottom:2px;width:18px;height:3px;border-radius:3px;background:var(--gold)}
  main{padding-bottom:110px}
  .toast{bottom:86px}
  footer{padding-bottom:88px}
}

/* ===== المرحلة ج: الإدارة والنماذج والجداول (v7c) ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sk{border-radius:var(--r);background:linear-gradient(90deg,#ece7da 25%,#f6f2e8 40%,#ece7da 65%);background-size:200% 100%;animation:shim 1.3s ease-in-out infinite}
.sk-hero{height:230px;border-radius:28px;margin-bottom:18px}.sk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.sk-tile{height:84px}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.sk-card{height:190px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media(max-width:640px){.sk-row{grid-template-columns:1fr 1fr}.sk-hero{height:200px}}
/* نماذج */
label.f{color:var(--navy);margin:16px 0 6px}
.in{padding:12px 14px;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--text);transition:border-color .15s,box-shadow .15s}
.in:hover{border-color:#cfc8b6}.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,85,164,.16)}.in::placeholder{color:#98a0ad}
.sbox input{border:1.5px solid var(--line);min-height:46px}.sbox input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,85,164,.16)}
.modal h3{color:var(--navy);font-size:21px;margin-bottom:4px}
.actions{margin-top:20px;gap:10px}
.btn{min-height:40px;transition:background .15s,transform .15s}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--blue-soft,#E6EEF8)}
.add{background:var(--navy)}.add:hover{background:var(--navy2)}
.chip{min-height:38px}.chip.on{background:var(--navy);border-color:var(--navy)}
.infobox{background:#F4EAD0;border-color:var(--gold-soft);color:#4a3a14}
.errbox{border:1px solid #efc4ca}
.lv{background:var(--blue-soft,#E6EEF8)}
/* بطاقات */
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(11,31,58,.1)}
.empty{background:var(--card);border:2px dashed var(--gold-soft);color:var(--muted)}
/* جداول */
table{border-collapse:separate;border-spacing:0}
th{background:#F4F0E6;color:var(--navy);font-size:12.5px;font-weight:800;letter-spacing:.02em}
th:first-child{border-top-right-radius:10px}th:last-child{border-top-left-radius:10px}
tr:hover td{background:#FBF9F3}
.stu-row td .acts{gap:8px;flex-wrap:nowrap}.stu-row td .acts .btn.del{margin-inline-start:6px}
@media(max-width:640px){
  .stu-table tr:first-child{display:none}
  .stu-table,.stu-table tbody{display:block;width:100%}
  .stu-row{display:block;padding:10px 0;border-bottom:1px solid var(--line)}.stu-row:last-child{border-bottom:0}
  .stu-row td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 6px;background:none!important}
  .stu-row td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:700;flex-shrink:0}
  .stu-row td:last-child::before{display:none}.stu-row td:last-child{justify-content:flex-end}
  .stu-row select.in{min-width:0;flex:1;max-width:210px}
}
/* تنبيهات */
.toast{background:var(--navy);border:1px solid var(--gold);box-shadow:0 12px 30px rgba(11,31,58,.3);display:none;align-items:center;gap:8px}
.toast.ok{background:var(--ok);border-color:transparent}.toast.err{background:var(--bad);border-color:transparent}
.toast.ok::before{content:"\2713";font-weight:800}.toast.err::before{content:"!";font-weight:800;background:rgba(255,255,255,.25);width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px}
/* الألعاب بالهوية الجديدة */
.gbar i{background:linear-gradient(90deg,var(--blue),var(--gold))}.gstars{color:var(--gold)}.gnb{color:var(--gold-text)}
.gnext{background:var(--navy)}.gnext:hover{background:var(--navy2)}
.gopt:not(:disabled):hover{background:var(--blue-soft,#E6EEF8)}
.glvb b{color:var(--navy)}.gq{border-color:var(--line)}
</style>

const errMsg = e => (e && e.message) ? e.message : 'حدث خطأ غير متوقع';
const extOf = n => ((n||'').split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'') || 'bin';

/* ---- ملفات المحتوى: عام (media) أو خاص بصف (media_class، مساره يبدأ برقم الصف) ---- */
const PRIV_BUCKET = 'media_class';
const isPrivPath = p => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\//i.test(String(p || ''));
const isStored = p => !!p && !/^(https?:|data:)/i.test(String(p));
let signed = {};
const pubUrl = (path, dl) => {
  if(isPrivPath(path)){
    const u = signed[path];
    return u ? (dl ? u + '&download=' + encodeURIComponent(dl) : u) : '#';
  }
  return sb.storage.from(BUCKET).getPublicUrl(path, dl ? { download: dl } : undefined).data.publicUrl;
};
async function upMedia(file, folder, classId){
  const path = (classId ? classId + '/' : '') + `${folder}/${uid()}.${extOf(file.name)}`;
  const r = await sb.storage.from(classId ? PRIV_BUCKET : BUCKET).upload(path, file, { contentType: file.type || undefined, cacheControl:'3600' });
  if(r.error) throw r.error;
  return path;
}
async function rmMedia(paths){
  const all = (paths || []).filter(isStored);
  const priv = all.filter(isPrivPath), pub = all.filter(p => !isPrivPath(p));
  try{ if(pub.length) await sb.storage.from(BUCKET).remove(pub); }catch{}
  try{ if(priv.length) await sb.storage.from(PRIV_BUCKET).remove(priv); }catch{}
}
async function resolveSigned(){
  const ps = new Set();
  items.forEach(i => { if(isPrivPath(i.file_path)) ps.add(i.file_path); });
  assignments.forEach(a => { if(isPrivPath(a.attach_path)) ps.add(a.attach_path); });
  quizzes.forEach(z => {
    if(isPrivPath(z.attach_path)) ps.add(z.attach_path);
    (z.questions || []).forEach(q => { if(isPrivPath(q.img)) ps.add(q.img); });
  });
  if(!ps.size) return;
  try{
    const r = await sb.storage.from(PRIV_BUCKET).createSignedUrls([...ps], 7200);
    (r.data || []).forEach(x => { if(x.signedUrl) signed[x.path] = x.signedUrl; });
  }catch{}
}

function closeModal(){ drDrop(); $('#modal').innerHTML = ''; }
/* ---- مسودات النماذج: حفظ تلقائي واسترجاع ---- */
let dr = null, drT = null;
const DR_TXT = 'input:not([type=file]):not([type=password]):not([type=radio]):not([type=checkbox]):not([type=hidden]),textarea';
const DR_ALL = DR_TXT + ',select';
const drKey = k => 'fo_draft_' + k;
function modalHasText(){ const M = $('#modal'); return !!M && [...M.querySelectorAll(DR_TXT)].some(e => e.value.trim() !== ''); }
function drSave(){
  if(!dr || !$('#modal .modal')) return;
  const M = $('#modal');
  try{
    if(!modalHasText()){ localStorage.removeItem(drKey(dr.key)); return; }
    const s = { f:[...M.querySelectorAll(DR_ALL)].map(e=>e.value), c:[...M.querySelectorAll('input[type=radio],input[type=checkbox]')].map(e=>e.checked), qb:M.querySelectorAll('.qb').length };
    const j = JSON.stringify(s);
    if(j.length < 700000) localStorage.setItem(drKey(dr.key), j);
  }catch(e){}
}
function drDrop(){ if(dr){ try{ localStorage.removeItem(drKey(dr.key)); }catch(e){} dr = null; } }
function drStart(key, reopen, fresh){
  dr = { key, reopen };
  if(fresh === true) return;
  let s = null; try{ s = JSON.parse(localStorage.getItem(drKey(key)) || 'null'); }catch(e){}
  if(!s || !Array.isArray(s.f)) return;
  const M = $('#modal');
  if(s.qb > 0 && $('#qlist')){
    while(M.querySelectorAll('.qb').length > s.qb) { const l = M.querySelectorAll('.qb'); l[l.length-1].remove(); }
    while(M.querySelectorAll('.qb').length < s.qb) addQBlock();
    numberQs();
  }
  for(let i = 0; i < s.f.length; i++){
    const el = M.querySelectorAll(DR_ALL)[i]; if(!el) break;
    if(el.tagName === 'SELECT'){
      if(el.value !== s.f[i] && [...el.options].some(o=>o.value === s.f[i])){ el.value = s.f[i]; el.dispatchEvent(new Event('change', {bubbles:true})); }
    } else el.value = s.f[i];
  }
  const cs = [...M.querySelectorAll('input[type=radio],input[type=checkbox]')];
  (s.c || []).forEach((v,i)=>{ if(cs[i]) cs[i].checked = v; });
  const bar = document.createElement('div'); bar.className = 'draftbar';
  bar.innerHTML = `<span>✔ استُرجعت مسودتك المحفوظة تلقائياً</span><button type="button" class="btn sec" data-a="draftClear">مسح المسودة وبدء من جديد</button>`;
  const h = M.querySelector('h3'); if(h) h.after(bar);
}
['input','change'].forEach(ev => document.addEventListener(ev, e => {
  if(!dr || !e.target || !e.target.closest || !e.target.closest('#modal')) return;
  clearTimeout(drT); drT = setTimeout(drSave, 500);
}));
window.addEventListener('pagehide', () => { if(dr) drSave(); });
let qs = null; // حالة الاختبار الجاري
function stopTimer(){ if(qs && qs.iv){ clearInterval(qs.iv); qs.iv = null; } }
function requestClose(){
  if(qs && qs.active && !qs.sub){
    if(!confirm('سيُلغى الاختبار ولن تُحفظ إجاباتك. هل تريد الخروج؟')) return;
  }
  if(dr){
    if(modalHasText() && !confirm('هل تريد الخروج؟\nستُحفظ مسودتك تلقائياً وتجدها عند فتح النموذج مرة أخرى.')) return;
    drSave(); dr = null;
  }
  stopTimer(); if(qs) qs.active = false;
  closeModal();
}

async function saveQuiz(){
  const title = $('#z_title').value.trim();
  if(!title){ toast('اكتب عنوان الاختبار','err'); return; }
  const qsx = [];
  for(const b of document.querySelectorAll('#qlist .qb')){
    const q = b.querySelector('.qtxt').value.trim();
    const radios = [...b.querySelectorAll('input[type=radio]')];
    const texts = [...b.querySelectorAll('.otxt')].map(i=>i.value.trim());
    const correctRaw = radios.findIndex(r=>r.checked);
    const imgFile = b.querySelector('.qimg').files[0] || null;
    const imgRaw = b.querySelector('.qimgurl').value.trim();
    const explain = b.querySelector('.qexp').value.trim();
    if(!q && texts.every(t=>!t) && !imgFile && !imgRaw) continue;
    if(!q){ toast('يوجد سؤال بدون نص','err'); return; }
    if(!texts[correctRaw]){ toast('الإجابة الصحيحة فارغة في السؤال: '+q,'err'); return; }
    const options = [], map = {};
    texts.forEach((t,i)=>{ if(t){ map[i]=options.length; options.push(t); } });
    if(options.length<2){ toast('كل سؤال يحتاج خيارين على الأقل: '+q,'err'); return; }
    let imgUrl = '';
    if(imgRaw){
      imgUrl = imgRaw.startsWith('data:image/') ? imgRaw : normUrl(imgRaw);
      if(!imgUrl){ toast('رابط الصورة غير صحيح في السؤال: '+q,'err'); return; }
    }
    qsx.push({ q, options, correct: map[correctRaw], explain, imgFile, imgUrl });
  }
  if(!qsx.length){ toast('أضف سؤالاً واحداً على الأقل','err'); return; }
  const attFile = $('#z_att').files[0] || null;
  const extRaw = $('#z_ext').value.trim(); const ext = extRaw ? normUrl(extRaw) : null;
  if(extRaw && !ext){ toast('رابط المرفق غير صحيح','err'); return; }
  const t = parseInt($('#z_time').value,10), cl = $('#z_close').value;
  const btn = $('#savebtn'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
  const uploaded = [];
  try{
    const zcls = $('#z_cls').value || null;
    const up = async (file, folder) => {
      const p = await upMedia(file, folder, zcls);
      uploaded.push(p); return p;
    };
    const questions = [];
    for(const x of qsx){
      let img = x.imgUrl;
      if(x.imgFile) img = await up(x.imgFile, 'qimg');
      const o = { q:x.q, options:x.options }; if(img) o.img = img;
      questions.push(o);
    }
    let attach_path = null, attach_name = null;
    if(attFile){ attach_path = await up(attFile, 'quiz'); attach_name = attFile.name; }
    const ins = await sb.from('quizzes').insert({
      title, level:$('#z_level').value, description:$('#z_desc').value.trim() || null,
      class_id: $('#z_cls').value || null, time_limit_min: t>0 ? t : null, closes_at: cl ? new Date(cl).toISOString() : null,
      attach_path, attach_name, ext_url: ext, questions
    }).select().single();
    if(ins.error) throw ins.error;
    const key = await sb.from('quiz_keys').insert({ quiz_id: ins.data.id, answers: qsx.map(x=>x.correct), explanations: qsx.map(x=>x.explain || '') });
    if(key.error){ await sb.from('quizzes').delete().eq('id', ins.data.id); throw key.error; }
    quizzes.unshift(ins.data); closeModal(); render(); toast('تم حفظ الاختبار','ok');
  }catch(err){
    if(uploaded.length) await rmMedia(uploaded);
    toast('تعذر حفظ الاختبار: ' + errMsg(err) + (/explanations|attach_path|ext_url/i.test(errMsg(err)) ? ' — شغّل سكربت التحديث v4 في Supabase' : ''),'err');
    btn.disabled = false; btn.textContent = 'حفظ الاختبار';
  }
}

async function startQuiz(id){
  const z = quizzes.find(x=>x.id===id);
  const name = $('#stu').value.trim();
  if(!name){ toast('اكتب اسمك أولاً','err'); $('#stu').focus(); return; }
  let rem = null;
  if(z.time_limit_min){
    const sbtn = document.querySelector('[data-a=startQuiz]'); if(sbtn) sbtn.disabled = true;
    const r = await sb.rpc('start_quiz', { p_quiz:id });
    if(r.error){
      if(sbtn) sbtn.disabled = false;
      const m = errMsg(r.error);
      toast(submitErr(m) || (/closed/i.test(m) ? 'هذا الاختبار مغلق' : 'تعذر بدء الاختبار: ' + m), 'err'); return;
    }
    rem = r.data && typeof r.data.remaining_seconds === 'number' ? r.data.remaining_seconds : null;
  }
  qs.name = name; qs.active = true;
  openModal(`
    <div class="qhead"><h3 dir="auto">${esc(z.title)}</h3>${z.time_limit_min?`<div class="timer" id="timerbox">${I('clock','s')}<span id="tm">--:--</span></div>`:''}</div>
    ${resBlock(z)}
    ${z.questions.map((q,i)=>`<div class="q"><div class="qt" dir="auto">${i+1}. ${esc(q.q)}</div>${q.img?`<img class="qpic" src="${esc(imgSrc(q.img))}" alt="">`:''}
      ${q.options.map((o,j)=>`<label class="ch"><input type="radio" name="q${i}" value="${j}"><span dir="auto">${esc(o)}</span></label>`).join('')}</div>`).join('')}
    <div class="actions"><button class="btn ok lg" id="subbtn" data-a="submitQuiz" data-id="${id}">${I('send','s')} تسليم الإجابات</button></div>`, true, true);
  if(z.time_limit_min){
    qs.end = Date.now() + (rem != null ? rem*1000 : z.time_limit_min*60000);
    const tick = () => {
      const el = $('#tm');
      if(!el){ stopTimer(); return; }
      const ms = qs.end - Date.now();
      if(ms <= 0){ stopTimer(); qs.auto = true; submitQuiz(id); return; }
      const s = Math.ceil(ms/1000);
      el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      $('#timerbox').classList.toggle('warn', s <= 60);
    };
    tick(); qs.iv = setInterval(tick, 500);
  }
}
async function submitQuiz(id){
  if(!qs || qs.sub) return;
  const z = quizzes.find(x=>x.id===id);
  qs.sub = true; stopTimer();
  const answers = z.questions.map((q,i)=>{ const r = document.querySelector(`input[name=q${i}]:checked`); return r ? +r.value : -1; });
  const btn = $('#subbtn'); if(btn) btn.disabled = true;
  const { data, error } = await sb.rpc('submit_quiz', { p_quiz:id, p_student:qs.name, p_answers:answers });
  if(error){
    qs.sub = false;
    toast(/closed/i.test(errMsg(error)) ? 'أُغلق هذا الاختبار ولم يعد يقبل التسليم' : (submitErr(errMsg(error)) || 'تعذر تسليم الاختبار: ' + errMsg(error)), 'err');
    if(btn) btn.disabled = false; return;
  }
  qs.active = false;
  const { score, total, answers: correct, explanations } = data;
  const ex = Array.isArray(explanations) ? explanations : [];
  const pct = Math.round(score/total*100);
  const wrongN = answers.filter((a,i)=>a!==-1 && a!==correct[i]).length;
  const skipN = answers.filter(a=>a===-1).length;
  const bad = total - score;
  const verdict = pct>=90 ? 'ممتاز! Excellent' : pct>=75 ? 'جيد جداً! Très bien' : pct>=50 ? 'ناجح — واصل التدريب' : 'تحتاج إلى مراجعة، حاول مرة أخرى';
  const rows = z.questions.map((q,i) => {
    const my = answers[i], ok = my === correct[i];
    return `<div class="q ${ok?'ok':'bad'}"><div class="qt" dir="auto">${ok?'✔':'✘'} ${i+1}. ${esc(q.q)}</div>
      ${q.img?`<img class="qpic" src="${esc(imgSrc(q.img))}" alt="">`:''}
      ${q.options.map((o,j)=>`<div class="ch ${j===correct[i]?'right':(j===my?'wrong':'')}"><span dir="auto">${j===correct[i]?'✔ ':(j===my?'✘ ':'')}${esc(o)}</span></div>`).join('')}
      ${ok ? '' : `<div class="mini">${my===-1 ? 'لم تُجب على هذا السؤال' : `إجابتك: <b dir="auto">${esc(q.options[my])}</b>`} — الصحيحة: <b dir="auto">${esc(q.options[correct[i]])}</b></div>`}
      ${ex[i] ? `<div class="infobox" dir="auto">${I('sparkle','s')} ${esc(ex[i])}</div>` : ''}</div>`;
  }).join('');
  openModal(`
    <h3>نتيجتك</h3>
    ${qs.auto?`<div class="infobox">${I('clock','s')} انتهى الوقت وتم تسليم إجاباتك تلقائياً.</div>`:''}
    <div class="score"><b style="color:${pct>=50?'var(--ok)':'var(--bad)'}">${score} / ${total}</b>${pct}%<div class="verdict">${verdict}</div>
      <div class="stats3"><div><b style="color:var(--ok)">${score}</b>صحيحة</div><div><b style="color:var(--bad)">${wrongN}</b>خاطئة</div><div><b>${skipN}</b>بلا إجابة</div></div></div>
    ${bad ? `<div class="rvbar"><button class="chip on" data-a="rvWrong">الأخطاء فقط (${bad})</button><button class="chip" data-a="rvAll">كل الأسئلة</button></div>` : `<div class="infobox">${I('check','s')} إجاباتك كلها صحيحة. أحسنت!</div>`}
    <div id="rv" class="${bad?'only-wrong':''}">${rows}</div>
    <div class="actions"><button class="btn lg" data-a="close">إغلاق</button></div>`, true);

}

/* ============ الروابط والمرفقات والاستيراد ============ */
function embedInfo(u){
  u = String(u || '').trim(); if(!u) return null;
  let m;
  if((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/)))
    return { type:'youtube', embed:'https://www.youtube.com/embed/' + m[1], url:u };
  if((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)) || (m = u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/)))
    return { type:'drive', embed:'https://drive.google.com/file/d/' + m[1] + '/preview', thumb:'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200', url:u };
  if((m = u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/)))
    return { type:'drive', embed:'https://docs.google.com/' + m[1] + '/d/' + m[2] + (m[1]==='presentation' ? '/embed' : '/preview'), url:u };
  if(u.startsWith('data:image/') || /\.(png|jpe?g|gif|webp|svg)(\?|#|$)/i.test(u)) return { type:'image', embed:u, url:u };
  if(/\.pdf(\?|#|$)/i.test(u)) return { type:'pdf', embed:u, url:u };
  if(/\.(mp4|webm|ogg)(\?|#|$)/i.test(u)) return { type:'video', embed:u, url:u };
  return { type:'link', url:u };
}
const safeHref = u => /^https?:\/\//i.test(String(u||'')) ? String(u) : '#';
function mediaHtml(info){
  if(!info) return '';
  if(info.type==='youtube' || info.type==='drive')
    return `<div class="vwrap" style="border-radius:14px;overflow:hidden"><iframe src="${esc(info.embed)}" allowfullscreen loading="lazy" allow="autoplay; fullscreen"></iframe></div>`;
  if(info.type==='pdf')
    return `<iframe class="pv" src="${esc('https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(info.url))}"></iframe>`;
  if(info.type==='pdfown') return `<iframe class="pv" src="${esc(info.embed)}"></iframe>`;
  if(info.type==='image') return `<img class="pv" src="${esc(info.embed)}" alt="">`;
  if(info.type==='video') return `<video controls preload="metadata" src="${esc(info.embed)}" style="width:100%;border-radius:14px"></video>`;
  return `<a class="btn" href="${esc(safeHref(info.url))}" target="_blank" rel="noopener noreferrer">${I('ext','s')} فتح الرابط</a>`;
}
function imgSrc(s){
  s = String(s || ''); if(!s) return '';
  if(s.startsWith('data:image/')) return s;
  if(/^https?:\/\//i.test(s)){ const inf = embedInfo(s); return (inf && inf.type==='drive' && inf.thumb) ? inf.thumb : s; }
  return pubUrl(s);
}
function resBlock(x){
  const out = [];
  if(x.attach_path){
    const n = (x.attach_name || '').toLowerCase(), u = pubUrl(x.attach_path);
    const body = /\.pdf$/.test(n) ? mediaHtml({ type:'pdfown', embed:u }) : /\.(png|jpe?g|gif|webp)$/.test(n) ? mediaHtml({ type:'image', embed:u }) : '';
    out.push(`<details class="res"><summary>${I('file','s')} ملف مرفق: <b dir="auto">${esc(x.attach_name || 'ملف')}</b></summary>${body}<div class="acts"><a class="btn sec" href="${esc(pubUrl(x.attach_path, x.attach_name))}">${I('download','s')} تحميل الملف</a></div></details>`);
  }
  if(x.ext_url){
    const inf = embedInfo(x.ext_url);
    const lbl = { youtube:'فيديو يوتيوب', drive:'ملف من جوجل درايف', image:'صورة', pdf:'ملف PDF', video:'فيديو', link:'رابط خارجي' }[inf.type];
    out.push(`<details class="res"><summary>${I('link','s')} ${lbl}</summary>${mediaHtml(inf)}<div class="acts"><a class="btn sec" href="${esc(safeHref(x.ext_url))}" target="_blank" rel="noopener noreferrer">${I('ext','s')} فتح في نافذة جديدة</a></div></details>`);
  }
  return out.join('');
}

/* ---- استيراد أسئلة من ملف JSON ---- */
function parseQuizJson(txt){
  let j = JSON.parse(txt);
  if(Array.isArray(j)) j = { questions:j };
  if(!j || !Array.isArray(j.questions)) throw new Error('لا توجد قائمة questions');
  const qs = j.questions.map((x, i) => {
    const q = String(x.q ?? x.question ?? '').trim();
    const options = (x.options ?? x.choices ?? []).map(o => String(o).trim()).filter(Boolean).slice(0, 6);
    const c = x.correct ?? x.answer;
    let idx = -1;
    if(typeof c === 'number') idx = c - 1;
    else if(typeof c === 'string'){
      const s = c.trim(), k = options.findIndex(o => o === s);
      if(k >= 0) idx = k;
      else if(/^\d+$/.test(s)) idx = parseInt(s, 10) - 1;
      else if(/^[A-Fa-f]$/.test(s)) idx = s.toUpperCase().charCodeAt(0) - 65;
    }
    if(!q) throw new Error('السؤال ' + (i+1) + ': نص السؤال فارغ');
    if(options.length < 2) throw new Error('السؤال ' + (i+1) + ': يحتاج خيارين على الأقل');
    if(idx < 0 || idx >= options.length) throw new Error('السؤال ' + (i+1) + ': الإجابة الصحيحة غير محددة');
    return { q, options, correct:idx, explain:String(x.explain ?? x.explanation ?? '').trim(), image:String(x.image ?? x.img ?? '').trim() };
  });
  if(!qs.length) throw new Error('لا توجد أسئلة في الملف');
  return { title:String(j.title || ''), level:String(j.level || ''), description:String(j.description || ''), time:parseInt(j.time_limit_min ?? j.time, 10) || 0, questions:qs };
}
async function importQuizJson(file){
  if(!file) return;
  try{
    const d = parseQuizJson(await file.text());
    if(d.title && !$('#z_title').value.trim()) $('#z_title').value = d.title;
    if(LEVELS.includes(d.level)) $('#z_level').value = d.level;
    if(d.description && !$('#z_desc').value.trim()) $('#z_desc').value = d.description;
    if(d.time > 0 && !$('#z_time').value) $('#z_time').value = d.time;
    $('#qlist').innerHTML = '';
    d.questions.forEach(q => addQBlock(q));
    toast('تم استيراد ' + d.questions.length + ' سؤال. راجعها ثم اضغط حفظ الاختبار', 'ok');
  }catch(err){ toast('ملف JSON غير صالح: ' + (err.message || ''), 'err'); }
}

function bulkForm(classId){
  openModal(`<h3>إضافة عدة طلاب دفعة واحدة</h3>
    <div class="infobox">اكتب كل طالب في سطر مستقل. يكفي كتابة الاسم، وسيُنشئ النظام اسم الدخول وكلمة المرور تلقائياً.<br>أو اكتب في السطر: <b>الاسم، اسم الدخول، كلمة المرور</b></div>
    <form id="bkf">
      <label class="f">قائمة الطلاب *</label>
      <textarea class="in" id="bk_list" dir="auto" style="min-height:190px" placeholder="أحمد محمد&#10;سارة علي&#10;محمود حسن"></textarea>
      ${clsSelect('bk_cls', classId, 'بدون صف', false)}
      <p class="note" id="bk_note">الحد الأقصى المنصوح به 25 طالباً في المرة (Supabase يسمح بنحو 30 تسجيلاً كل 5 دقائق).</p>
      <div class="actions"><button class="btn lg" id="bkbtn" type="submit">إنشاء الحسابات</button><button class="btn sec lg" type="button" data-a="close">إلغاء</button></div>
    </form>`, true);
  $('#bkf').onsubmit = async e => {
    e.preventDefault();
    const lines = $('#bk_list').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length){ toast('اكتب اسم طالب واحد على الأقل','err'); return; }
    if(lines.length > 40){ toast('الحد الأقصى 40 طالباً في المرة','err'); return; }
    const cls = $('#bk_cls').value || null;
    const taken = takenLogins(), rows = [];
    for(const line of lines){
      const p = line.split(/[,،\t]/).map(s=>s.trim());
      let login = (p[1] || '').toLowerCase();
      const pw = p[2] || genPw();
      if(!login) login = genLogin(taken);
      let bad = null;
      if(!p[0]) bad = 'الاسم فارغ';
      else if(!validLogin(login)) bad = 'اسم الدخول غير صالح';
      else if(taken.has(login)) bad = 'اسم الدخول مكرر';
      else if(pw.length < 6) bad = 'كلمة المرور أقل من 6 أحرف';
      if(bad){ rows.push({ name:p[0] || line, login, pw, ok:false, err:bad, todo:false }); continue; }
      taken.add(login);
      rows.push({ name:p[0], login, pw, ok:false, todo:true });
    }
    const btn = $('#bkbtn'); btn.disabled = true;
    let done = 0, stop = null; const total = rows.filter(r=>r.todo).length;
    for(const r of rows){
      if(!r.todo) continue;
      if(stop){ r.err = stop; continue; }
      $('#bk_note').textContent = `جارٍ الإنشاء... ${done} من ${total}`;
      try{ await createStudent({ name:r.name, login:r.login, pw:r.pw, classId:cls }); r.ok = true; }
      catch(err){
        r.err = friendlyErr(err);
        if(err && (err.code==='confirm' || /rate limit|too many|429/i.test(errMsg(err)))) stop = r.err;
      }
      done++; await new Promise(res=>setTimeout(res, 250));
    }
    await loadStudents(); render();
    credsModal(rows, `تم إنشاء ${rows.filter(r=>r.ok).length} من ${rows.length} حساب`);
  };
}

/* ---------- لوحة المتابعة (للمدرس) ---------- */
let trk = { cls:'all', data:null };
async function loadTrack(){
  const [r, s] = await Promise.all([
    sb.from('results').select('id,quiz_id,student,student_id,score,total,created_at').order('created_at',{ascending:false}),
    sb.from('submissions').select('id,assignment_id,student,student_id,grade,note,created_at').order('created_at',{ascending:false})
  ]);
  const bad = r.error || s.error;
  trk.data = bad ? null : { results:r.data||[], subs:s.data||[] };
  return bad ? errMsg(bad) : '';
}
async function renderTrack(v, err){
  v.innerHTML = err + skel();
  const e = await loadTrack();
  if(state.tab !== 'track') return;
  if(e){ v.innerHTML = err + `<div class="errbox">تعذر تحميل بيانات المتابعة: ${esc(e)}</div>`; return; }
  drawTrack(v, err);
}
function trkStats(){
  const { results, subs } = trk.data;
  const list = students.filter(s => trk.cls==='all' || (trk.cls==='none' ? !s.class_id : s.class_id===trk.cls));
  const ids = new Set(list.map(s=>s.id));
  const rs = results.filter(r => ids.has(r.student_id)), ss = subs.filter(x => ids.has(x.student_id));
  const pct = r => r.total ? r.score/r.total*100 : 0;
  const rows = list.map(s => {
    const a = rs.filter(r=>r.student_id===s.id), b = ss.filter(x=>x.student_id===s.id);
    const avg = a.length ? a.reduce((n,r)=>n+pct(r),0)/a.length : null;
    const last = [...a.map(r=>r.created_at), ...b.map(x=>x.created_at)].sort().pop() || null;
    return { s, a, b, avg, last, ungraded:b.filter(x=>!x.grade).length };
  });
  const dayAgo = d => (Date.now() - new Date(d).getTime()) / 86400000;
  return { list, rs, ss, rows, pct, inactive: rows.filter(r => !r.last || dayAgo(r.last) > 14).length };
}
function drawTrack(v, err){
  if(state.tab !== 'track') return;
  const st = trkStats(), cname = id => (classes.find(c=>c.id===id)||{}).name || '—';
  const avgAll = st.rs.length ? Math.round(st.rs.reduce((n,r)=>n+st.pct(r),0)/st.rs.length) : null;
  const ungr = st.ss.filter(x=>!x.grade).length;
  const tiles = [
    ['users','c-blue',st.list.length,'طالب'], ['quiz','c-green',st.rs.length,'محاولة اختبار'],
    ['chart','c-purple',avgAll==null?'—':avgAll+'%','متوسط الدرجات'], ['assign','c-orange',ungr,'واجب بانتظار التصحيح'],
    ['clock','c-teal',st.inactive,'لم يتفاعل منذ 14 يوماً']
  ];
  const bar = p => `<span class="pbar ${p<50?'low':''}"><i style="width:${Math.round(p)}%"></i></span>`;
  const rowsSorted = st.rows.slice().sort((x,y)=> (x.avg==null) - (y.avg==null) || (x.avg||0) - (y.avg||0));
  const quizRows = quizzes.map(z => {
    const a = st.rs.filter(r=>r.quiz_id===z.id);
    return { z, n:a.length, avg:a.length ? a.reduce((n,r)=>n+st.pct(r),0)/a.length : null };
  }).filter(x=>x.n).sort((x,y)=>x.avg-y.avg);
  const asgRows = assignments.map(a => {
    const b = st.ss.filter(x=>x.assignment_id===a.id);
    return { a, n:b.length, un:b.filter(x=>!x.grade).length };
  }).filter(x=>x.n);
  const opts = `<option value="all">كل الصفوف</option>` + classes.map(c=>`<option value="${c.id}" ${trk.cls===c.id?'selected':''}>${esc(c.name)}</option>`).join('') + `<option value="none" ${trk.cls==='none'?'selected':''}>بدون صف</option>`;
  v.innerHTML = err + `
    <h2 class="st"><span>${I('chart')} متابعة الطلاب</span><small>${st.list.length}</small></h2>
    <div class="trk-bar"><select class="in" data-a="trkCls" aria-label="الصف">${opts}</select><button class="btn sec" data-a="trkRefresh">تحديث</button></div>
    <div class="tiles">${tiles.map(([ic,col,n,l])=>`<div class="tile static"><div class="ib ${col}">${I(ic)}</div><div><b>${n}</b><span>${l}</span></div></div>`).join('')}</div>

    <h2 class="st"><span>${I('users')} الطلاب</span><small>الأضعف أولاً — اضغط على طالب للتفاصيل</small></h2>
    ${st.list.length ? `<div class="card" style="padding:6px 14px;overflow-x:auto"><table><tr><th>الطالب</th><th>الصف</th><th>المحاولات</th><th>متوسط الدرجات</th><th>الواجبات</th><th>آخر نشاط</th></tr>
      ${rowsSorted.map(x=>`<tr class="rowopen" data-a="trkOpen" data-id="${x.s.id}"><td data-label="الطالب" dir="auto"><b>${esc(x.s.full_name)}</b></td><td data-label="الصف">${esc(cname(x.s.class_id))}</td><td data-label="المحاولات">${x.a.length}</td>
        <td data-label="المتوسط">${x.avg==null?'<span class="tag warn">لم يبدأ</span>':Math.round(x.avg)+'%'+bar(x.avg)}</td>
        <td data-label="الواجبات">${x.b.length}${x.ungraded?` <span class="tag warn">${x.ungraded} بلا تصحيح</span>`:''}</td><td data-label="آخر نشاط">${x.last?fmtDT(x.last):'—'}</td></tr>`).join('')}</table></div>`
      : emptyBox('users','c-blue','لا يوجد طلاب في هذا الاختيار','')}

async function renderMine(v, err){
  const s = state.me.student;
  v.innerHTML = err + skel();
  const [r, a] = await Promise.all([
    sb.from('results').select('*').order('created_at',{ascending:false}),
    sb.from('submissions').select('*').order('created_at',{ascending:false})
  ]);
  if(state.tab !== 'mine') return;
  const rs = r.data || [], sb_ = a.data || [];
  const qTitle = id => { const z = quizzes.find(x=>x.id===id); return z ? z.title : 'اختبار محذوف'; };
  const aTitle = id => { const z = assignments.find(x=>x.id===id); return z ? z.title : 'واجب محذوف'; };
  v.innerHTML = err + `
    <div class="card mine-head"><div class="ib c-blue">${I('user')}</div>
      <div style="flex:1"><h3 dir="auto">${esc(s.full_name)}</h3>
        <div class="tags" style="margin-top:6px"><span class="tag cls">${I('class','s')} ${s.class_name?esc(s.class_name):'لم يُحدَّد صفك بعد'}</span><span class="tag">${esc(s.login_id)}</span></div></div>
      <button class="btn sec" data-a="myPw">${I('key','s')} تغيير كلمة المرور</button></div>

    <h2 class="st"><span>${I('quiz')} نتائج اختباراتي</span><small>${rs.length}</small></h2>
    ${rs.length ? `<div class="card" style="padding:6px 14px;overflow-x:auto"><table><tr><th>الاختبار</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th></tr>
      ${rs.map(x=>`<tr><td dir="auto">${esc(qTitle(x.quiz_id))}</td><td>${x.score}/${x.total}</td><td><span class="tag ${x.score/x.total>=0.5?'ok':'bad'}">${Math.round(x.score/x.total*100)}%</span></td><td>${fmtDT(x.created_at)}</td></tr>`).join('')}</table></div>`
      : emptyBox('quiz','c-green','لم تحلّ أي اختبار بعد','ستظهر نتائجك هنا بعد حل الاختبارات.')}

    <h2 class="st"><span>${I('assign')} واجباتي</span><small>${sb_.length}</small></h2>
    ${sb_.length ? `<div class="grid">${sb_.map(x=>`<div class="card"><h3 dir="auto">${esc(aTitle(x.assignment_id))}</h3>
        <div class="tags"><span class="tag">${I('calendar','s')} ${fmtDT(x.created_at)}</span>${x.grade?`<span class="tag ok">الدرجة: ${esc(x.grade)}</span>`:`<span class="tag warn">بانتظار التصحيح</span>`}</div>
        ${x.note?`<div class="infobox" style="margin:4px 0 0" dir="auto">ملاحظة المدرس: ${esc(x.note)}</div>`:''}</div>`).join('')}</div>`

}
function changeMyPw(){
  openModal(`<h3>تغيير كلمة المرور</h3>
    <label class="f">كلمة المرور الجديدة</label><input class="in" id="mp1" type="password" dir="ltr" autocomplete="new-password">
    <label class="f">أعد كتابتها</label><input class="in" id="mp2" type="password" dir="ltr" autocomplete="new-password">
    <div class="actions"><button class="btn lg" id="mpbtn" data-a="doMyPw">حفظ</button><button class="btn sec lg" data-a="close">إلغاء</button></div>`);
}
async function doMyPw(){
  const p1 = $('#mp1').value, p2 = $('#mp2').value;
  if(p1.length < 6){ toast('كلمة المرور 6 أحرف على الأقل','err'); return; }
  if(p1 !== p2){ toast('كلمتا المرور غير متطابقتين','err'); return; }
  const btn = $('#mpbtn'); btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password:p1 });
  if(error){ toast('تعذر التغيير: ' + errMsg(error), 'err'); btn.disabled = false; return; }
  closeModal(); toast('تم تغيير كلمة المرور','ok');
}

function trText(s){

  const lead = s.match(/^\s*/)[0], trail = s.match(/\s*$/)[0], t = s.trim();

function trDom(root){

function giToEngine(it){

    case 'odd': return { q:d.q, o:d.o, a:d.a, e:d.e||'' };

    case 'tf': return { q:d.q, a:d.a, e:d.e||'' };

function giReg(){
  const reg = (ar, en) => { if(ar && en) GAME_EN[ar] = en; };

    const d = it.data || {}, en = d.en; if(!en) return;
    if(it.game==='mcq' || it.game==='odd'){ reg(d.q, en.q); (d.o||[]).forEach((x,i)=>reg(x, en.o && en.o[i])); reg(d.e, en.e); }
    else if(it.game==='tf' || it.game==='fill'){ reg(d.q, en.q); reg(d.e, en.e); }
    else if(it.game==='scramble' || it.game==='order') reg(d.h, en.h);

  });
}

        <div class="gmem">${m.cards.map(c=>{ const on = m.open.includes(c.id) || m.done.includes(c.k); return `<button class="gcard2 ${on?'on':''} ${m.done.includes(c.k)?'ok':''}" data-a="gMem" data-id="${c.id}" ${on?'disabled':''} aria-label="بطاقة"><span ${c.fr?'dir="ltr"':''}>${on?esc(c.t):'?'}</span></button>`; }).join('')}</div>
        <button class="chip" data-a="gMenu" style="margin-top:18px">إنهاء اللعبة</button>`;
      return;
    }
    if(G.game==='match'){
      const m = G.m;
      v.innerHTML = `<div class="ghead"><span>${esc(d.title)} · ${G.level}</span><span>✔ ${m.done.length}/${n}</span><span>✖ ${m.err}</span>${snd}</div>
        <div class="gbar"><i style="width:${m.done.length/n*100}%"></i></div>
        <p class="gsub">اختر الكلمة الفرنسية ثم معناها العربي.</p>
        <div class="gmatch"><div>${m.l.map(x=>`<button class="gopt mt ${m.done.includes(x.k)?'ok':m.selL===x.k?'sel':''}" data-a="gML" data-id="${x.k}" ${m.done.includes(x.k)?'disabled':''} dir="ltr">${esc(x.t)}</button>`).join('')}</div>
        <div>${m.r.map(x=>`<button class="gopt mt ${m.done.includes(x.k)?'ok':m.bad===x.k?'bad':''}" data-a="gMR" data-id="${x.k}" ${m.done.includes(x.k)?'disabled':''}>${esc(x.t)}</button>`).join('')}</div></div>
        <button class="chip" data-a="gMenu" style="margin-top:18px">إنهاء اللعبة</button>`;
      return;
    }
    if(G.game==='scramble' || G.game==='order'){
      const pk = G.sel.map(k=>q.tiles.find(t=>t.k===k).c);
      body = `<div class="gans ${G.game==='order'?'gordr':''} ${ans?(G.pick?'ok':'bad'):''}" dir="ltr">${q.tiles.map((_,k)=>`<b>${pk[k]?esc(pk[k]):'&nbsp;'}</b>`).join('')}</div>
        <div class="gtiles" dir="ltr">${q.tiles.map(t=>`<button class="gtile ${G.game==='order'?'gword':''}" data-a="gTile" data-id="${t.k}" ${ans||G.sel.includes(t.k)?'disabled':''}>${esc(t.c)}</button>`).join('')}</div>
        ${ans?'':`<div class="gacts"><button class="chip" data-a="gBack">⌫ تراجع</button><button class="chip" data-a="gClear">مسح الكل</button></div>`}`;
    }
    else if(G.game==='fill'){
      body = `<form class="gfillf" data-a="gFillForm" onsubmit="return false"><input id="gfill" class="in gfill" dir="ltr" lang="fr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب هنا…" value="${esc(ans?G.val:'')}" ${ans?'disabled':''}>${ans?'':`<button type="button" class="gnext" data-a="gFill">تحقق</button>`}</form>`;
    }
    else if(G.game==='hangman'){
      const lt = c => /[a-zà-ÿœæç]/i.test(c);
      body = `<div class="gans" dir="ltr">${Array.from(q.w).map(c=>`<b>${!lt(c)?esc(c):(ans||G.hg.g.includes(noAcc(c)))?esc(c):'_'}</b>`).join('')}</div>
        <div class="glives" aria-label="المحاولات المتبقية">${'❤️'.repeat(6-G.hg.wrong)}${'🖤'.repeat(G.hg.wrong)}</div>
        <div class="gkeys" dir="ltr">${'abcdefghijklmnopqrstuvwxyz'.split('').map(c=>`<button class="gkey ${G.hg.g.includes(c)?(noAcc(q.w).includes(c)?'ok':'bad'):''}" data-a="gKey" data-id="${c}" ${ans||G.hg.g.includes(c)?'disabled':''}>${c}</button>`).join('')}</div>`;
    }
    else if(G.game==='mcq' || G.game==='odd' || G.game==='listen') body = `<div class="gopts">${q.o.map((t,k)=>`<button class="gopt ${ans?(k===q.a?'ok':k===G.pick?'bad':'dim'):''}" data-a="gAns" data-id="${k}" ${ans?'disabled':''}><i>${k+1}</i><span dir="auto">${esc(t)}</span></button>`).join('')}</div>`;
    else body = `<div class="gtf">${['صح ✓ Vrai','خطأ ✗ Faux'].map((t,k)=>`<button class="gopt ${ans?(k===q.a?'ok':k===G.pick?'bad':'dim'):''}" data-a="gAns" data-id="${k}" ${ans?'disabled':''}><i>${k+1}</i><span>${t}</span></button>`).join('')}</div>`;
    const fb = ans ? `<div class="gfb ${G.pick===q.a?'ok':'bad'}"><b>${G.pick===q.a?'أحسنت! 🎉':'ليست الإجابة الصحيحة'}</b><span>${esc(q.e||'')}${G.close&&G.game==='fill'?' — '+esc(G.close):''}</span></div><button class="gnext" data-a="gNext" autofocus>${G.i+1>=n?'عرض النتيجة':'السؤال التالي'} ←</button>` : '';
    v.innerHTML = `<div class="ghead"><span>${esc(d.title)} · ${G.level}</span><span>⭐ ${G.pts}</span>${G.streak>=2?`<span>🔥 ${G.streak}</span>`:''}${snd}</div>
      <div class="gbar"><i style="width:${(G.i+(ans?1:0))/n*100}%"></i></div>
      <div class="gq"><small>السؤال ${G.i+1} من ${n}</small><h3 dir="auto">${esc(G.game==='listen'?'استمع ثم اختر الكلمة التي سمعتها':(G.game==='scramble'||G.game==='order'||G.game==='hangman')?q.h:q.q)}</h3>${G.game==='odd'?'<small dir="ltr" style="display:block;text-align:right">Quel est l\'intrus ?</small>':G.game==='scramble'?'<small>رتّب الحروف لتكوين الكلمة الفرنسية</small>':G.game==='order'?'<small>رتّب الكلمات لتكوين الجملة الفرنسية</small>':''}</div>${G.game==='listen'?'<div class="gacts" style="margin-bottom:14px"><button class="gnext" data-a="gSpeak">🔊 استمع</button><button class="chip" data-a="gSlow">🐢 ببطء</button></div>':''}${body}${fb}
      <button class="chip" data-a="gMenu" style="margin-top:18px">إنهاء اللعبة</button>`;
    return;
  }
  if(G.view==='end'){
    const n = G.qs.length, pc = G.ok/n, st = pc===1?3:pc>=.7?2:pc>=.4?1:0;
    v.innerHTML = `<div class="gend"><div class="gstars">${[0,1,2].map(k=>k<st?'★':'☆').join('')}</div>
      <h2>${pc===1?'ممتاز! علامة كاملة':pc>=.7?'أحسنت!':pc>=.4?'جيد، حاول مرة أخرى':'لا بأس، التدريب يصنع الإتقان'}</h2>
      <div class="gstats"><div><b>${G.ok}/${n}</b><span>إجابات صحيحة</span></div><div><b>${G.pts}</b><span>النقاط</span></div><div><b>${G.stat3?G.stat3[0]:G.maxStreak}</b><span>${G.stat3?G.stat3[1]:'أطول سلسلة'}</span></div><div><b>${G.tot}ث</b><span>الوقت</span></div></div>
      ${G.newBest?`<p class="gnb">🏆 رقم قياسي جديد على هذا الجهاز!</p>`:G.prevBest?`<p class="gsub">أفضل نتيجة سابقة: ${G.prevBest}</p>`:''}
      <div class="gacts"><button class="gnext" data-a="gAgain">العب مرة أخرى</button><button class="chip" data-a="gLevels">تغيير المستوى</button><button class="chip" data-a="gMenu">كل الألعاب</button></div></div>`;
  }
}
const GH = {
  ...GIH,
  gPick:id=>{ if(!GAME_DATA[id]) return; if(id==='listen' && !window.speechSynthesis){ toast(trText('جهازك أو متصفحك لا يدعم النطق الصوتي'),'err'); return; } G.game = id; G.view = 'level'; render(); },
  gLvl:id=>gameStart(id), gAns:id=>gameAnswer(id), gNext:gameNext,
  gAgain:()=>gameStart(G.level), gLang:()=>{ G.lang = G.lang==='en'?'ar':'en'; try{ localStorage.setItem('fo_lang', G.lang); }catch(e){} render(); }, gTile:id=>scrTile(id), gKey:id=>hgKey(id), gSpeak:()=>speak(G.qs[G.i].w,.9), gSlow:()=>speak(G.qs[G.i].w,.55), gMem:id=>memPick(id), gBack:scrBack, gClear:scrClear, gFill:fillCheck, gML:id=>matchPick('l',id), gMR:id=>matchPick('r',id),
  gLevels:()=>{ G.view='level'; render(); },
  gMenu:()=>{ G.view='menu'; G.game=null; render(); },
  gSound:()=>{ G.snd = !G.snd; try{ localStorage.setItem('fo_snd', G.snd?'1':'0'); }catch(e){} render(); }
};
document.addEventListener('keydown', e => {
  if(state.tab!=='games' || G.view!=='play' || e.ctrlKey || e.metaKey || e.altKey) return;
  if(document.querySelector('#modal .ov') || /INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'')) return;
  if(G.game==='fill' && G.pick===null){ if(e.key==='Enter'){ e.preventDefault(); fillCheck(); } return; }
  if(G.game==='hangman'){ if(G.pick===null && /^[a-zA-Z]$/.test(e.key)) hgKey(e.key.toLowerCase()); else if(e.key==='Enter' && G.pick!==null){ e.preventDefault(); gameNext(); } return; }
  if(G.game==='scramble' || G.game==='order' || G.game==='match' || G.game==='memory') { if(e.key==='Enter' && G.pick!==null){ e.preventDefault(); gameNext(); } else if(e.key==='Backspace') scrBack(); return; }
  if(/^[1-4]$/.test(e.key)) gameAnswer(+e.key-1);
  else if(e.key==='Enter' && G.pick!==null){ e.preventDefault(); gameNext(); }
});

const H = {
  ...GH,
  moreMenu:()=>{
    const m = [['videos','video','الفيديوهات'],['assignments','assign','الواجبات'],['links','link','الروابط']];
    if(state.teacher){ m.push(['track','chart','المتابعة']); m.push(['people','users','الصفوف والطلاب']); }
    else if(state.me && state.me.student) m.push(['mine','list','نتائجي']);
    openModal(`<h3>المزيد</h3><div class="moregrid">${m.map(([k,ic,l])=>`<button data-a="moreGo" data-id="${k}">${I(ic)}<span>${l}</span></button>`).join('')}</div>`);
  },
  moreGo:id=>{ closeModal(); state.tab=id; state.level='all'; state.cat='all'; state.cls='all'; state.q=''; render(); window.scrollTo(0,0); },
  tab:id=>{ state.tab=id; state.level='all'; state.cat='all'; state.cls='all'; state.q=''; render(); window.scrollTo(0,0); },
  clsf:id=>{ state.cls=id; render(); },
  level:id=>{ state.level=id; render(); },
  cat:id=>{ state.cat=id; render(); },
  login, doLogin, logout, seed,
  addFile:()=>uploadForm('file'), addVideo:()=>uploadForm('video'),
  trkOpen, trkRefresh:()=>render(), draftClear:()=>{ if(dr){ const r = dr.reopen; drDrop(); if(r) r(true); } }, addQuiz:quizForm, addq:()=>addQBlock(), rmq:(id,el)=>{ el.closest('.qb').remove(); numberQs(); }, saveQuiz,
  addAssign:assignForm, addLink:linkForm,
  delItem, delQuiz, delAssign, delLink, delSub,
  takeQuiz, startQuiz, submitQuiz, results:showResults,
  openSubmit, subs:showSubs, saveGrade,
  preview, close:requestClose,
  addClass:addClassForm, delClass, addStudent:id=>addStudentForm(id), bulkStudents:id=>bulkForm(id),
  resetPw, doResetPw, delStudent, copyCreds, printCreds:()=>window.print(), myPw:changeMyPw, doMyPw,
  jsonSample:downloadSample, rvWrong:()=>setRv(true), rvAll:()=>setRv(false)
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  if(el.dataset.a==='ovclose'){ if(e.target===el && !el.classList.contains('full') && !modalHasText()) requestClose(); return; }
  if(el.dataset.a==='search') return;
  H[el.dataset.a]?.(el.dataset.id, el);
});
document.addEventListener('input', e=>{
  if(e.target.dataset?.a==='search'){
    state.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const s = document.querySelector('[data-a=search]'); if(s){ s.focus(); s.setSelectionRange(pos,pos); }
  }
});

/* ============ البدء ============ */
(async function init(){
  if(!configured || !window.supabase){
    if(configured){ $('#view').innerHTML = `<div class="setup"><h2>تعذر تحميل مكتبة Supabase</h2><p style="color:var(--muted)">تأكد من اتصالك بالإنترنت ثم أعد تحميل الصفحة.</p></div>`; }
    else renderSetup();
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global:{ fetch: safeFetch } });
  sb.auth.onAuthStateChange((ev, sess) => {
    setTimeout(() => {
      if(((sess && sess.user && sess.user.id) || null) !== state.uid) afterAuth();
    }, 0);
  });
  await afterAuth();
})();
</script>
