<style>
:root{
  --ink:#0e0e0e; --blue:#0055A4; --blue2:#1f6fc9; --red:#EF4135;
  --flag-solid:linear-gradient(90deg,#0055A4 0 33.34%,#ffffff 33.34% 66.67%,#EF4135 66.67%);
  --flag-card:linear-gradient(90deg,#0055A4 0 33.34%,#dfe6f5 33.34% 66.67%,#EF4135 66.67%); --bg:#f3f5fb; --card:#fff;
  --text:#1c2333; --muted:#6b7385; --line:#e3e7f1; --ok:#1e9e5a; --bad:#d6334a; --warn:#e8890c;
  --r:20px; --shadow:0 2px 14px rgba(31,58,147,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Cairo","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;background:linear-gradient(115deg,#e3edfb 0%,#f6f9ff 32%,#ffffff 50%,#fff6f5 68%,#fde6e3 100%) fixed;color:var(--text);line-height:1.6;min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
button:disabled{opacity:.55;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.i.s{width:16px;height:16px}
.tricolor{height:8px;background:var(--flag-solid)}

/* header */
header{background:var(--ink);border-bottom:1px solid #262626;position:sticky;top:0;z-index:40}
.bar{max-width:1240px;margin:auto;padding:8px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center}
.brand img{height:60px;width:auto;display:block}
nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;padding:9px 15px;border-radius:12px;color:#b4b9c7;font-weight:600;font-size:14px;transition:.2s;display:flex;align-items:center;gap:8px;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:rgba(255,255,255,.15);color:#fff}
.tbtn{background:var(--blue2);color:#fff;padding:9px 18px;border-radius:12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tbtn.out{background:transparent;color:#ff8a93;border:1px solid #ff8a93}
.tbar{background:#fff7e6;border-bottom:1px solid #ffe2a8;padding:8px 24px;font-size:13px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.tbar button{background:#fff;border:1px solid #f0c978;color:#8a5a00;padding:5px 12px;border-radius:9px;font-size:12.5px;font-weight:700}
@media(max-width:820px){nav{order:3;width:100%;flex:none}.brand img{height:52px}}

main{max-width:1240px;margin:auto;padding:30px 24px 80px}

/* hero */
.hero{background:radial-gradient(800px 380px at 15% -10%,rgba(255,255,255,.18),transparent 60%),linear-gradient(135deg,#00265a 0%,#0055A4 58%,#1f6fc9 100%);color:#fff;border-radius:28px;padding:50px 44px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;position:relative;overflow:hidden}
.eyebrow{display:inline-block;background:rgba(255,255,255,.14);padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:14px}
.hero h1{font-size:40px;line-height:1.25;font-weight:800;margin-bottom:12px}
.hero h1 em{font-style:normal;color:#ffd166}
.hero p{opacity:.9;max-width:520px;font-size:16px}
.cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.cbtn{background:#fff;color:var(--blue);padding:12px 24px;border-radius:14px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.cbtn.ghost{background:rgba(255,255,255,.14);color:#fff}
.words{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;direction:ltr}
.words span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:10px 20px;border-radius:16px;font-weight:700;font-size:20px;backdrop-filter:blur(4px)}
.words span:nth-child(2n){transform:translateY(12px);background:rgba(255,255,255,.24)}
.words span:nth-child(3n){background:rgba(239,65,53,.45)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding:34px 24px}.hero h1{font-size:30px}.words{display:none}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:22px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;text-align:right;transition:.25s;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(31,58,147,.12)}
.tile .ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.tile b{display:block;font-size:22px;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.c-blue{background:#e9eefc;color:var(--blue)}.c-red{background:#fde8ea;color:var(--red)}
.c-purple{background:#efe7ff;color:#7a3cf0}.c-green{background:#e3f7ec;color:var(--ok)}
.c-orange{background:#fff0dc;color:var(--warn)}.c-teal{background:#dff6f6;color:#0c8d94}

h2.st{font-size:22px;margin:38px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:800}
h2.st small{font-size:14px;color:var(--muted);font-weight:600}
h2.st .i{color:var(--blue2);margin-left:8px}
.more{background:none;color:var(--blue2);font-weight:700;font-size:14px}

/* upcoming */
.up{display:grid;gap:10px}
.upi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:14px}
.upi .ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.upi div.t{flex:1}
.upi b{display:block}
.upi small{color:var(--muted)}
.upi .left{font-weight:800;color:var(--warn);font-size:13px;white-space:nowrap}

/* toolbar */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.sbox{flex:1;min-width:210px;position:relative}
.sbox .i{position:absolute;top:50%;right:14px;transform:translateY(-50%);color:var(--muted)}
.sbox input{width:100%;padding:11px 42px 11px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.add{background:var(--red);color:#fff;padding:11px 20px;border-radius:14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}
.card{background:var(--flag-card) top/100% 4px no-repeat, var(--card);border-radius:var(--r);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px;transition:.25s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(31,58,147,.12)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.lv{font-size:12px;font-weight:800;padding:3px 11px;border-radius:999px;background:#e9eefc;color:var(--blue);direction:ltr;white-space:nowrap}
.card h3{font-size:17px;line-height:1.4}
.card p{font-size:13.5px;color:var(--muted);flex:1}
.meta{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:9px;background:var(--bg);color:#4a5268}

.acts{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}

.btn.sec{background:#e9eefc;color:var(--blue)}
.btn.del{background:#fde8ea;color:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.lg{padding:12px 28px;font-size:15px}
.empty{text-align:center;padding:54px 20px;color:var(--muted);background:#fff;border:2px dashed var(--line);border-radius:var(--r)}
.empty .eic{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px}
.empty .eic .i{width:32px;height:32px}
.empty h4{color:var(--text);font-size:18px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.errbox{background:#fde8ea;color:var(--bad);padding:14px 18px;border-radius:14px;margin-bottom:18px;font-size:14px}
.setup{max-width:640px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;text-align:center}
.setup code{background:var(--bg);padding:2px 8px;border-radius:6px;direction:ltr;display:inline-block}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* link card */
.lcard{flex-direction:row;align-items:flex-start;gap:14px;text-decoration:none}
.lcard img{width:44px;height:44px;border-radius:12px;background:var(--bg);padding:6px;flex-shrink:0}
.lcard .b{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.lcard .host{direction:ltr;text-align:right;font-size:12px;color:var(--blue2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* video */
.vcard{padding:0;overflow:hidden}
.vwrap{aspect-ratio:16/9;background:#000}
.vwrap video,.vwrap iframe{width:100%;height:100%;border:0;display:block}
.vcard .body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:8px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,22,45,.6);z-index:100;display:grid;place-items:center;padding:20px;overflow:auto}
.modal{background:var(--flag-card) top/100% 6px no-repeat, #fff;border-radius:24px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:28px;position:relative;margin:auto}
.modal.wide{max-width:900px}
.grl{direction:ltr;text-align:left}
.grtitle{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px;padding-bottom:8px;border-bottom:3px solid #B8893B;width:max-content;max-width:100%}
.grfr{font-size:26px;font-weight:800;color:#0B1F3A}.grsub{font-size:15px;color:#6b7385}
.grbox{padding:16px 18px;margin-bottom:14px;text-align:left}
.grp{font-size:16px;line-height:1.9;color:#1c2333;margin-bottom:12px}
.gar{display:block;text-align:left;color:#1c2333;line-height:1.9}
.gen{display:block;text-align:left;color:#6b7385;font-size:.93em;line-height:1.7}
.gsep{color:#b8893b}
.grh{margin:16px 0 8px;color:#8a6a2c;font-size:15px}.grh2{margin:20px 2px 10px;color:#0B1F3A}
.grul{padding:0 0 0 22px;margin:0}.grul li{margin-bottom:10px}
.grtw{overflow-x:auto;margin:8px 0}
.grt{border-collapse:collapse;width:100%;font-size:15px}
.grt th{background:#0B1F3A;color:#fff;padding:8px 12px;font-weight:700;text-align:center}
.grt td{border:1px solid #e8e2d4;padding:8px 12px;text-align:center}.grt td:first-child{background:#faf6ea;font-weight:700}
.grt tbody tr:nth-child(even) td{background:#fcfaf3}.grt tbody tr:nth-child(even) td:first-child{background:#faf6ea}
.grl .vfr{text-align:left}.grtr .gar,.grtr .gen{display:block}
.grq{padding:12px 0;border-bottom:1px solid #eee7d6}.grq:last-of-type{border-bottom:0}
.grqt{font-weight:800;color:#0B1F3A;margin-bottom:10px;font-size:16px;line-height:1.7}
.gropts{display:flex;gap:8px;flex-wrap:wrap}
.gro{border:1px solid #d9d2bf;background:#fff;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;color:#0B1F3A;text-align:left}
.gro:disabled{cursor:default;opacity:.75}.gro.right{background:#e6f5ec;border-color:#4cb27a;color:#17623a;opacity:1}.gro.wrong{background:#fde8ea;border-color:#e46a77;color:#a3202f;opacity:1}
.grwhy{margin-top:8px;font-size:14px;line-height:1.7}.grwhy b{display:block;margin-bottom:2px}.grwhy.ok{color:#17623a}.grwhy.bad{color:#a3202f}
.grwhy .gar,.grwhy .gen{color:inherit}
.grres{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:12px 14px;background:#faf3e0;border-radius:14px;color:#0B1F3A}

.vbar2{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 12px}
.vpills{display:flex;gap:6px;flex-wrap:wrap}
.vpill{border:1px solid #d9d2bf;background:#fff;color:#0B1F3A;border-radius:999px;padding:9px 18px;font:inherit;font-weight:800;cursor:pointer}
.vpill.sm{padding:6px 13px;font-size:13px;font-weight:700}
.vpill.on{background:#0B1F3A;color:#fff;border-color:#0B1F3A}
.vq{width:100%;margin-top:4px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.vcat{background:#fff;border:1px solid #e8e2d4;border-radius:16px;padding:16px;text-align:right;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 8px rgba(11,31,58,.05);transition:transform .15s}
.vcat:hover{transform:translateY(-3px)}
.vcat b{font-size:17px;color:#0B1F3A}.vcat .vf{color:#6b7280;font-size:13px;text-align:left}.vcat .vn{font-size:13px;color:#8a6a2c;font-weight:700}
.vbar{display:block;height:7px;border-radius:6px;background:#ece6d6;overflow:hidden;flex:1}
.vbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0B1F3A,#B8893B)}
.vlist{padding:4px 14px}
.vrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee7d6}
.vrow:last-child{border-bottom:0}.vrow.ok .vfr{color:#17623a}
.vsp{flex:0 0 40px;height:40px;border-radius:12px;border:0;background:#e9eefc;color:#1d4e9e;display:flex;align-items:center;justify-content:center;cursor:pointer}
.vtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.vfr{font-size:20px;font-weight:800;color:#0B1F3A;display:block;text-align:left}
.vm{color:#374151;font-size:15px}.vsep{color:#b8893b}
.vmw{display:block}.vmw .vm,.vmw .vsep{display:inline}
.vk{border:1px solid #d9d2bf;background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;color:#6b7280;cursor:pointer;white-space:nowrap}
.vk.on{background:#e6f5ec;border-color:#9fd3b2;color:#17623a}
.vtag{font-size:12px;color:#8a6a2c;background:#faf3e0;border-radius:999px;padding:4px 10px;white-space:nowrap}
.vprog{display:flex;align-items:center;gap:12px;margin:4px 0 14px;font-weight:700;color:#0B1F3A}
.vcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;min-height:240px;background:#fff;border:1px solid #e8e2d4;border-radius:22px;padding:28px 18px;margin-bottom:16px;font:inherit;cursor:pointer;box-shadow:0 6px 22px rgba(11,31,58,.08);text-align:center}
.vcard .vfr{font-size:34px;text-align:center}.vcard.flip{background:#0B1F3A}
.vcard.flip .vmean .vm{color:#fff;font-size:24px;font-weight:800}.vcard.flip .vsep{color:#e2c27a}
.vcard.flip .vhint .vfr{color:#e2c27a;font-size:18px;font-weight:700}
.vhint{color:#8a8f98;font-size:14px}
@media(max-width:560px){.vfr{font-size:18px}.vcard .vfr{font-size:30px}.vtag{display:none}}

#auth{display:flex;align-items:center;gap:8px}
.tbtn.bell{position:relative;padding:8px 11px}
.bn{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;border-radius:10px;background:#d64545;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #0B1F3A}
.bn[hidden]{display:none}
.bitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eee7d6}
.bitem .bi{flex:0 0 38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.bitem .bt{flex:1;min-width:0}.bitem .bt b{display:block}.bitem .bt small{color:#6b7280}
.bitem.warn{background:#fff4f2;border-radius:12px;padding:12px;margin:6px 0;border:1px solid #f1c9c3}
.bitem .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.bitem .row .btn{padding:6px 12px;font-size:13px}
.trk-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
.trk-bar select{max-width:260px}
.pbar{display:inline-block;vertical-align:middle;width:84px;height:8px;border-radius:6px;background:#e8e2d4;overflow:hidden;margin-inline-start:8px}
.pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0B1F3A,#B8893B)}
.pbar.low i{background:#c0392b}
tr.rowopen{cursor:pointer}
tr.rowopen:hover td{background:#faf6ea}
.tile.static{cursor:default}
.ov.full{padding:0;display:block;background:var(--bg,#fff)}
.modal.full{max-width:860px;width:100%;max-height:none;min-height:100%;border-radius:0;margin:0 auto;overflow:visible;padding:24px 22px 28px}
.modal.full .actions{position:sticky;bottom:0;background:var(--card,#fff);padding:12px 0 14px;margin-top:18px;border-top:1px solid #e8e2d4;z-index:4}
.draftbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#e8f5ec;border:1px solid #b9dfc6;color:#17623a;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.draftbar .btn{padding:6px 12px;font-size:13px}
.modal h3{font-size:21px;margin-bottom:16px;padding-left:40px}
.x{position:absolute;top:16px;left:18px;width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:3}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.in{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.in:focus{outline:2px solid #b8c7ff;border-color:var(--blue2)}
textarea.in{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:2px dashed #b8c4ea;border-radius:14px;padding:20px;text-align:center;background:#f7f9ff;color:var(--muted);font-size:14px;margin-top:10px}
.drop input{margin-top:8px;max-width:100%}
.actions{display:flex;gap:10px;margin-top:22px;justify-content:flex-start;flex-wrap:wrap}
.progress{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:12px;display:none}
.progress i{display:block;height:100%;width:40%;background:var(--blue2);animation:ind 1.1s ease-in-out infinite alternate}
@keyframes ind{from{margin-right:0}to{margin-right:60%}}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--blue2)}
.infobox{background:#f3f6ff;border:1px solid #dbe4ff;border-radius:14px;padding:14px 16px;font-size:14px;margin:12px 0}

/* quiz builder + taking */
.qb{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;background:#fafbff}
.qb-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qb .rm{background:#fde8ea;color:var(--bad);padding:4px 12px;border-radius:8px;font-size:12px;font-weight:700}
.opt{display:flex;gap:10px;align-items:center;margin-top:8px}
.opt input[type=radio]{accent-color:var(--ok);width:18px;height:18px;flex-shrink:0}
.opt .in{padding:9px 12px}
.q{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.q .qt{font-weight:800;margin-bottom:10px}
.ch{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;transition:.15s}
.ch:hover{background:#f3f6ff}
.ch input{accent-color:var(--blue);width:17px;height:17px}
.ch.right{background:#e3f7ec;border-color:var(--ok)}
.ch.wrong{background:#fde8ea;border-color:var(--bad)}
.score{text-align:center;padding:24px;border-radius:18px;background:linear-gradient(135deg,#eef2ff,#fff);border:1px solid var(--line);margin-bottom:20px}
.score b{font-size:48px;color:var(--blue);display:block;direction:ltr}
.qhead{position:sticky;top:-28px;background:#fff;margin:-28px -28px 16px;padding:14px 28px;z-index:2;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.qhead h3{margin:0;padding-left:44px;font-size:17px}
.timer{display:flex;align-items:center;gap:8px;background:#e9eefc;color:var(--blue);font-weight:800;padding:7px 14px;border-radius:12px;direction:ltr;font-size:18px}
.timer.warn{background:#fde8ea;color:var(--bad);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}

/* submissions */
.sub{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sub .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sub .ans{background:var(--bg);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;margin:8px 0}
.sub .gr{display:grid;grid-template-columns:110px 1fr auto auto;gap:8px;margin-top:10px;align-items:center}
@media(max-width:640px){.sub .gr{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
th{background:var(--bg);font-size:13px}
iframe.pv{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px}
img.pv{max-width:100%;border-radius:12px}
.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:#1c2333;color:#fff;padding:12px 22px;border-radius:14px;z-index:300;font-weight:700;display:none;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}
/* ---- هوية فرنسية ---- */
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 0 58%,rgba(255,255,255,.07) 58% 76%,rgba(239,65,53,.22) 76% 100%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:8px;background:var(--flag-solid)}
nav button.on{background:rgba(255,255,255,.15) var(--flag-solid) bottom/100% 3px no-repeat;color:#fff}
h2.st>span:first-child{position:relative;padding-bottom:12px}
h2.st>span:first-child::after{content:"";position:absolute;right:0;bottom:0;width:72px;height:5px;border-radius:5px;background:var(--flag-solid);box-shadow:0 0 0 1px #d6dff0}
footer{position:relative}
footer::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--flag-solid)}
.tile{background:var(--flag-card) top/100% 3px no-repeat, #fff}
.qhead{border-top:0}
/* ---- المرفقات والمراجعة ---- */
.res{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:#fafbff}
.res summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px}
.res[open] summary{margin-bottom:10px}
.res .acts{margin-top:10px}
.qpic{max-width:100%;max-height:340px;border-radius:12px;margin:6px 0 4px;display:block;border:1px solid var(--line);background:#fff}
.qb input[type=file]{max-width:100%;font-size:13px}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}

.score .verdict{font-weight:800;margin-top:6px}
.jsonbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.tag.cls{background:#dff6f6;color:#0c6f75}
.who{color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;margin-left:10px}

.stu-row td{vertical-align:middle}
.stu-row select.in{padding:7px 10px;min-width:150px}
.mine-head{flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap}

}

/* ===== الألعاب ===== */

.gsnd{font-size:20px;background:#fff;border:1px solid var(--line);border-radius:12px;width:42px;height:38px}

/* ===== هوية FRENCH ONLINE by Monsieur Ahmed (v7a) ===== */
:root{--ink:#0B1F3A;--navy:#0B1F3A;--navy2:#13305A;--blue2:#2F6DB5;--bg:#F4F0E6;--card:#FFFDF8;--line:#E6E1D6;--text:#1A2433;--muted:#5B6472;
  --gold:#B8893B;--gold-text:#8A6420;--gold-soft:#E8D5A6;--ivory:#FAF7F0;--shadow:0 2px 14px rgba(11,31,58,.07)}
body{background:var(--ivory)}
.tricolor{height:3px}
header{border-bottom:3px solid var(--gold)}
.brand{gap:14px;direction:ltr}
.brand .by{display:flex;flex-direction:column;border-inline-start:1px solid var(--gold);padding-inline-start:14px;line-height:1.15}
.brand .by i{font-style:normal;font-size:9px;letter-spacing:.34em;color:var(--gold-soft);font-weight:700}
.brand .by b{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:500;font-size:19px;color:#fff;letter-spacing:.01em}
nav button{color:#c3cbdb}
nav button.on{background:rgba(255,255,255,.1) linear-gradient(var(--gold),var(--gold)) bottom/100% 3px no-repeat;color:#fff}
@media(max-width:1330px){nav{gap:2px}nav button{padding:9px 9px;gap:6px;font-size:13.5px}.bar{gap:12px;padding-inline:16px}}
@media(max-width:1120px){nav button{padding:9px 7px;font-size:12.5px}nav button .i{display:none}}
@media(max-width:960px){nav button{padding:8px 5px;font-size:12px}}
header.navwrap .bar nav#nav{order:3;flex:1 1 100%;margin-top:-2px;padding-bottom:4px}
.tbtn{background:var(--blue)}
.tbar{background:#F4EAD0;border-bottom:1px solid var(--gold-soft);color:#4a3a14}
.tbar button{border-color:var(--gold-soft);color:var(--gold-text)}
.hero{background:linear-gradient(135deg,#0B1F3A 0%,#13305A 100%)}
.hero::before{inset:auto;top:-70px;inset-inline-end:-70px;width:280px;height:280px;border:1px solid rgba(232,213,166,.35);border-radius:50%;background:none}
.hero::after{height:3px;background:var(--gold)}
.hero h1 em{color:var(--gold-soft)}
.hero .tagline{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--gold-soft);font-size:17px;margin:-2px 0 10px;direction:ltr;text-align:start;opacity:1}
.words span:nth-child(3n){background:rgba(184,137,59,.4)}
.card{background:var(--card)}
.tile{background:var(--card)}
.modal{background:var(--card);border-top:4px solid var(--gold)}
h2.st>span:first-child::after{background:var(--gold);box-shadow:none}
footer{background:var(--navy);color:#aab4c6;padding:26px 16px}
footer::before{height:3px;background:var(--gold)}
footer .fl{font-size:15px;margin-bottom:4px;direction:ltr}footer .fl b{letter-spacing:.14em;color:#fff}footer .fl .by{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--gold-soft)}footer .fs{direction:ltr;font-size:12.5px}
.lghead{display:flex;align-items:center;gap:14px;background:var(--navy);margin:-28px -28px 20px;padding:18px 26px 18px 66px;direction:ltr}
.lghead img{height:46px}.lghead span{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--gold-soft);font-size:18px;line-height:1.3;border-inline-start:1px solid var(--gold);padding-inline-start:14px}.lghead small{font-family:Cairo,sans-serif;font-style:normal;font-size:11.5px;color:#c3cbdb}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}header :focus-visible,footer :focus-visible{outline-color:var(--gold-soft)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(max-width:520px){.brand{gap:10px}.brand img{height:44px}.brand .by{padding-inline-start:10px}.brand .by i{display:none}.brand .by b{font-size:15px}}

/* ===== المرحلة ب: تنقل الجوال (v7b) ===== */
#bnav{display:none}
.moregrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.moregrid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 8px;background:var(--ivory);border:1px solid var(--line);border-radius:16px;font-weight:700;font-size:15px;color:var(--navy);min-height:92px;justify-content:center}
.moregrid button:active{background:var(--blue-soft,#E6EEF8)}.moregrid .i{width:28px;height:28px;color:var(--blue)}

  #bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);z-index:45;padding:6px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(11,31,58,.08)}
  #bnav button{background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 2px;min-height:54px;border-radius:12px;position:relative}
  #bnav button .i{width:23px;height:23px}
  #bnav button.on{color:var(--blue)}
  #bnav button.on::after{content:"";position:absolute;bottom:2px;width:18px;height:3px;border-radius:3px;background:var(--gold)}
  main{padding-bottom:110px}
  .toast{bottom:86px}
  footer{padding-bottom:88px}
}

/* ===== المرحلة ج: الإدارة والنماذج والجداول (v7c) ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sk{border-radius:var(--r);background:linear-gradient(90deg,#ece7da 25%,#f6f2e8 40%,#ece7da 65%);background-size:200% 100%;animation:shim 1.3s ease-in-out infinite}
.sk-hero{height:230px;border-radius:28px;margin-bottom:18px}.sk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.sk-tile{height:84px}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.sk-card{height:190px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media(max-width:640px){.sk-row{grid-template-columns:1fr 1fr}.sk-hero{height:200px}}
/* نماذج */
label.f{color:var(--navy);margin:16px 0 6px}

.in:hover{border-color:#cfc8b6}.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,85,164,.16)}.in::placeholder{color:#98a0ad}
.sbox input{border:1.5px solid var(--line);min-height:46px}.sbox input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,85,164,.16)}
.modal h3{color:var(--navy);font-size:21px;margin-bottom:4px}
.actions{margin-top:20px;gap:10px}
.btn{min-height:40px;transition:background .15s,transform .15s}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--blue-soft,#E6EEF8)}
.add{background:var(--navy)}.add:hover{background:var(--navy2)}
.chip{min-height:38px}.chip.on{background:var(--navy);border-color:var(--navy)}
.infobox{background:#F4EAD0;border-color:var(--gold-soft);color:#4a3a14}
.errbox{border:1px solid #efc4ca}
.lv{background:var(--blue-soft,#E6EEF8)}
/* بطاقات */
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(11,31,58,.1)}
.empty{background:var(--card);border:2px dashed var(--gold-soft);color:var(--muted)}
/* جداول */
table{border-collapse:separate;border-spacing:0}
th{background:#F4F0E6;color:var(--navy);font-size:12.5px;font-weight:800;letter-spacing:.02em}
th:first-child{border-top-right-radius:10px}th:last-child{border-top-left-radius:10px}
tr:hover td{background:#FBF9F3}
.stu-row td .acts{gap:8px;flex-wrap:nowrap}.stu-row td .acts .btn.del{margin-inline-start:6px}
@media(max-width:640px){
  .stu-table tr:first-child{display:none}
  .stu-table,.stu-table tbody{display:block;width:100%}
  .stu-row{display:block;padding:10px 0;border-bottom:1px solid var(--line)}.stu-row:last-child{border-bottom:0}
  .stu-row td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 6px;background:none!important}
  .stu-row td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:700;flex-shrink:0}
  .stu-row td:last-child::before{display:none}.stu-row td:last-child{justify-content:flex-end}
  .stu-row select.in{min-width:0;flex:1;max-width:210px}
}
/* تنبيهات */
.toast{background:var(--navy);border:1px solid var(--gold);box-shadow:0 12px 30px rgba(11,31,58,.3);display:none;align-items:center;gap:8px}
.toast.ok{background:var(--ok);border-color:transparent}.toast.err{background:var(--bad);border-color:transparent}
.toast.ok::before{content:"\2713";font-weight:800}.toast.err::before{content:"!";font-weight:800;background:rgba(255,255,255,.25);width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px}
/* الألعاب بالهوية الجديدة */
.gbar i{background:linear-gradient(90deg,var(--blue),var(--gold))}.gstars{color:var(--gold)}.gnb{color:var(--gold-text)}
.gnext{background:var(--navy)}.gnext:hover{background:var(--navy2)}
.gopt:not(:disabled):hover{background:var(--blue-soft,#E6EEF8)}
.glvb b{color:var(--navy)}.gq{border-color:var(--line)}
</style>

  clearTimeout(toastT); toastT = setTimeout(()=>t.style.display='none', 3800);
}
function normUrl(u){
  u = String(u||'').trim(); if(!u) return null;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try{ const x = new URL(u); return (x.protocol==='http:'||x.protocol==='https:') ? x.href : null; }catch{ return null; }
}
const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return ''; } };

/* ---- ملفات المحتوى: عام (media) أو خاص بصف (media_class، مساره يبدأ برقم الصف) ---- */
const PRIV_BUCKET = 'media_class';
const isPrivPath = p => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\//i.test(String(p || ''));
const isStored = p => !!p && !/^(https?:|data:)/i.test(String(p));
let signed = {};
const pubUrl = (path, dl) => {
  if(isPrivPath(path)){
    const u = signed[path];
    return u ? (dl ? u + '&download=' + encodeURIComponent(dl) : u) : '#';
  }
  return sb.storage.from(BUCKET).getPublicUrl(path, dl ? { download: dl } : undefined).data.publicUrl;
};
async function upMedia(file, folder, classId){
  const path = (classId ? classId + '/' : '') + `${folder}/${uid()}.${extOf(file.name)}`;
  const r = await sb.storage.from(classId ? PRIV_BUCKET : BUCKET).upload(path, file, { contentType: file.type || undefined, cacheControl:'3600' });
  if(r.error) throw r.error;
  return path;
}
async function rmMedia(paths){
  const all = (paths || []).filter(isStored);
  const priv = all.filter(isPrivPath), pub = all.filter(p => !isPrivPath(p));
  try{ if(pub.length) await sb.storage.from(BUCKET).remove(pub); }catch{}
  try{ if(priv.length) await sb.storage.from(PRIV_BUCKET).remove(priv); }catch{}
}
async function resolveSigned(){
  const ps = new Set();
  items.forEach(i => { if(isPrivPath(i.file_path)) ps.add(i.file_path); });
  assignments.forEach(a => { if(isPrivPath(a.attach_path)) ps.add(a.attach_path); });
  quizzes.forEach(z => {
    if(isPrivPath(z.attach_path)) ps.add(z.attach_path);
    (z.questions || []).forEach(q => { if(isPrivPath(q.img)) ps.add(q.img); });
  });
  if(!ps.size) return;
  try{
    const r = await sb.storage.from(PRIV_BUCKET).createSignedUrls([...ps], 7200);
    (r.data || []).forEach(x => { if(x.signedUrl) signed[x.path] = x.signedUrl; });
  }catch{}
}

/* ---- مسودات النماذج: حفظ تلقائي واسترجاع ---- */
let dr = null, drT = null;
const DR_TXT = 'input:not([type=file]):not([type=password]):not([type=radio]):not([type=checkbox]):not([type=hidden]),textarea';
const DR_ALL = DR_TXT + ',select';
const drKey = k => 'fo_draft_' + k;
function modalHasText(){ const M = $('#modal'); return !!M && [...M.querySelectorAll(DR_TXT)].some(e => e.value.trim() !== ''); }
function drSave(){
  if(!dr || !$('#modal .modal')) return;
  const M = $('#modal');
  try{
    if(!modalHasText()){ localStorage.removeItem(drKey(dr.key)); return; }
    const s = { f:[...M.querySelectorAll(DR_ALL)].map(e=>e.value), c:[...M.querySelectorAll('input[type=radio],input[type=checkbox]')].map(e=>e.checked), qb:M.querySelectorAll('.qb').length };
    const j = JSON.stringify(s);
    if(j.length < 700000) localStorage.setItem(drKey(dr.key), j);
  }catch(e){}
}
function drDrop(){ if(dr){ try{ localStorage.removeItem(drKey(dr.key)); }catch(e){} dr = null; } }
function drStart(key, reopen, fresh){
  dr = { key, reopen };
  if(fresh === true) return;
  let s = null; try{ s = JSON.parse(localStorage.getItem(drKey(key)) || 'null'); }catch(e){}
  if(!s || !Array.isArray(s.f)) return;
  const M = $('#modal');
  if(s.qb > 0 && $('#qlist')){
    while(M.querySelectorAll('.qb').length > s.qb) { const l = M.querySelectorAll('.qb'); l[l.length-1].remove(); }
    while(M.querySelectorAll('.qb').length < s.qb) addQBlock();
    numberQs();
  }
  for(let i = 0; i < s.f.length; i++){
    const el = M.querySelectorAll(DR_ALL)[i]; if(!el) break;
    if(el.tagName === 'SELECT'){
      if(el.value !== s.f[i] && [...el.options].some(o=>o.value === s.f[i])){ el.value = s.f[i]; el.dispatchEvent(new Event('change', {bubbles:true})); }
    } else el.value = s.f[i];
  }
  const cs = [...M.querySelectorAll('input[type=radio],input[type=checkbox]')];
  (s.c || []).forEach((v,i)=>{ if(cs[i]) cs[i].checked = v; });
  const bar = document.createElement('div'); bar.className = 'draftbar';
  bar.innerHTML = `<span>✔ استُرجعت مسودتك المحفوظة تلقائياً</span><button type="button" class="btn sec" data-a="draftClear">مسح المسودة وبدء من جديد</button>`;
  const h = M.querySelector('h3'); if(h) h.after(bar);
}
['input','change'].forEach(ev => document.addEventListener(ev, e => {
  if(!dr || !e.target || !e.target.closest || !e.target.closest('#modal')) return;
  clearTimeout(drT); drT = setTimeout(drSave, 500);
}));
window.addEventListener('pagehide', () => { if(dr) drSave(); });
let qs = null; // حالة الاختبار الجاري
function stopTimer(){ if(qs && qs.iv){ clearInterval(qs.iv); qs.iv = null; } }
function requestClose(){
  if(qs && qs.active && !qs.sub){
    if(!confirm('سيُلغى الاختبار ولن تُحفظ إجاباتك. هل تريد الخروج؟')) return;
  }
  if(dr){
    if(modalHasText() && !confirm('هل تريد الخروج؟\nستُحفظ مسودتك تلقائياً وتجدها عند فتح النموذج مرة أخرى.')) return;
    drSave(); dr = null;
  }
  stopTimer(); if(qs) qs.active = false;
  closeModal();
}

async function saveQuiz(){
  const title = $('#z_title').value.trim();
  if(!title){ toast('اكتب عنوان الاختبار','err'); return; }
  const qsx = [];
  for(const b of document.querySelectorAll('#qlist .qb')){
    const q = b.querySelector('.qtxt').value.trim();
    const radios = [...b.querySelectorAll('input[type=radio]')];
    const texts = [...b.querySelectorAll('.otxt')].map(i=>i.value.trim());
    const correctRaw = radios.findIndex(r=>r.checked);
    const imgFile = b.querySelector('.qimg').files[0] || null;
    const imgRaw = b.querySelector('.qimgurl').value.trim();
    const explain = b.querySelector('.qexp').value.trim();
    if(!q && texts.every(t=>!t) && !imgFile && !imgRaw) continue;
    if(!q){ toast('يوجد سؤال بدون نص','err'); return; }
    if(!texts[correctRaw]){ toast('الإجابة الصحيحة فارغة في السؤال: '+q,'err'); return; }
    const options = [], map = {};
    texts.forEach((t,i)=>{ if(t){ map[i]=options.length; options.push(t); } });
    if(options.length<2){ toast('كل سؤال يحتاج خيارين على الأقل: '+q,'err'); return; }
    let imgUrl = '';
    if(imgRaw){
      imgUrl = imgRaw.startsWith('data:image/') ? imgRaw : normUrl(imgRaw);
      if(!imgUrl){ toast('رابط الصورة غير صحيح في السؤال: '+q,'err'); return; }
    }
    qsx.push({ q, options, correct: map[correctRaw], explain, imgFile, imgUrl });
  }
  if(!qsx.length){ toast('أضف سؤالاً واحداً على الأقل','err'); return; }
  const attFile = $('#z_att').files[0] || null;
  const extRaw = $('#z_ext').value.trim(); const ext = extRaw ? normUrl(extRaw) : null;
  if(extRaw && !ext){ toast('رابط المرفق غير صحيح','err'); return; }
  const t = parseInt($('#z_time').value,10), cl = $('#z_close').value;
  const btn = $('#savebtn'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
  const uploaded = [];
  try{
    const zcls = $('#z_cls').value || null;
    const up = async (file, folder) => {
      const p = await upMedia(file, folder, zcls);
      uploaded.push(p); return p;
    };
    const questions = [];
    for(const x of qsx){
      let img = x.imgUrl;
      if(x.imgFile) img = await up(x.imgFile, 'qimg');
      const o = { q:x.q, options:x.options }; if(img) o.img = img;
      questions.push(o);
    }
    let attach_path = null, attach_name = null;
    if(attFile){ attach_path = await up(attFile, 'quiz'); attach_name = attFile.name; }
    const ins = await sb.from('quizzes').insert({
      title, level:$('#z_level').value, description:$('#z_desc').value.trim() || null,
      class_id: $('#z_cls').value || null, time_limit_min: t>0 ? t : null, closes_at: cl ? new Date(cl).toISOString() : null,
      attach_path, attach_name, ext_url: ext, questions
    }).select().single();
    if(ins.error) throw ins.error;
    const key = await sb.from('quiz_keys').insert({ quiz_id: ins.data.id, answers: qsx.map(x=>x.correct), explanations: qsx.map(x=>x.explain || '') });
    if(key.error){ await sb.from('quizzes').delete().eq('id', ins.data.id); throw key.error; }
    quizzes.unshift(ins.data); closeModal(); render(); toast('تم حفظ الاختبار','ok');
  }catch(err){
    if(uploaded.length) await rmMedia(uploaded);
    toast('تعذر حفظ الاختبار: ' + errMsg(err) + (/explanations|attach_path|ext_url/i.test(errMsg(err)) ? ' — شغّل سكربت التحديث v4 في Supabase' : ''),'err');
    btn.disabled = false; btn.textContent = 'حفظ الاختبار';
  }
}

}
async function startQuiz(id){
  const z = quizzes.find(x=>x.id===id);
  const name = $('#stu').value.trim();
  if(!name){ toast('اكتب اسمك أولاً','err'); $('#stu').focus(); return; }
  let rem = null;
  if(z.time_limit_min){
    const sbtn = document.querySelector('[data-a=startQuiz]'); if(sbtn) sbtn.disabled = true;
    const r = await sb.rpc('start_quiz', { p_quiz:id });
    if(r.error){
      if(sbtn) sbtn.disabled = false;
      const m = errMsg(r.error);
      toast(submitErr(m) || (/closed/i.test(m) ? 'هذا الاختبار مغلق' : 'تعذر بدء الاختبار: ' + m), 'err'); return;
    }
    rem = r.data && typeof r.data.remaining_seconds === 'number' ? r.data.remaining_seconds : null;
  }
  qs.name = name; qs.active = true;
  openModal(`
    <div class="qhead"><h3 dir="auto">${esc(z.title)}</h3>${z.time_limit_min?`<div class="timer" id="timerbox">${I('clock','s')}<span id="tm">--:--</span></div>`:''}</div>
    ${resBlock(z)}
    ${z.questions.map((q,i)=>`<div class="q"><div class="qt" dir="auto">${i+1}. ${esc(q.q)}</div>${q.img?`<img class="qpic" src="${esc(imgSrc(q.img))}" alt="">`:''}
      ${q.options.map((o,j)=>`<label class="ch"><input type="radio" name="q${i}" value="${j}"><span dir="auto">${esc(o)}</span></label>`).join('')}</div>`).join('')}
    <div class="actions"><button class="btn ok lg" id="subbtn" data-a="submitQuiz" data-id="${id}">${I('send','s')} تسليم الإجابات</button></div>`, true, true);
  if(z.time_limit_min){
    qs.end = Date.now() + (rem != null ? rem*1000 : z.time_limit_min*60000);
    const tick = () => {
      const el = $('#tm');
      if(!el){ stopTimer(); return; }
      const ms = qs.end - Date.now();
      if(ms <= 0){ stopTimer(); qs.auto = true; submitQuiz(id); return; }
      const s = Math.ceil(ms/1000);
      el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
      $('#timerbox').classList.toggle('warn', s <= 60);
    };
    tick(); qs.iv = setInterval(tick, 500);
  }
}
async function submitQuiz(id){
  if(!qs || qs.sub) return;
  const z = quizzes.find(x=>x.id===id);
  qs.sub = true; stopTimer();
  const answers = z.questions.map((q,i)=>{ const r = document.querySelector(`input[name=q${i}]:checked`); return r ? +r.value : -1; });
  const btn = $('#subbtn'); if(btn) btn.disabled = true;
  const { data, error } = await sb.rpc('submit_quiz', { p_quiz:id, p_student:qs.name, p_answers:answers });
  if(error){
    qs.sub = false;
    toast(/closed/i.test(errMsg(error)) ? 'أُغلق هذا الاختبار ولم يعد يقبل التسليم' : (submitErr(errMsg(error)) || 'تعذر تسليم الاختبار: ' + errMsg(error)), 'err');
    if(btn) btn.disabled = false; return;
  }
  qs.active = false;
  const { score, total, answers: correct, explanations } = data;
  const ex = Array.isArray(explanations) ? explanations : [];
  const pct = Math.round(score/total*100);
  const wrongN = answers.filter((a,i)=>a!==-1 && a!==correct[i]).length;
  const skipN = answers.filter(a=>a===-1).length;
  const bad = total - score;
  const verdict = pct>=90 ? 'ممتاز! Excellent' : pct>=75 ? 'جيد جداً! Très bien' : pct>=50 ? 'ناجح — واصل التدريب' : 'تحتاج إلى مراجعة، حاول مرة أخرى';
  const rows = z.questions.map((q,i) => {
    const my = answers[i], ok = my === correct[i];
    return `<div class="q ${ok?'ok':'bad'}"><div class="qt" dir="auto">${ok?'✔':'✘'} ${i+1}. ${esc(q.q)}</div>
      ${q.img?`<img class="qpic" src="${esc(imgSrc(q.img))}" alt="">`:''}
      ${q.options.map((o,j)=>`<div class="ch ${j===correct[i]?'right':(j===my?'wrong':'')}"><span dir="auto">${j===correct[i]?'✔ ':(j===my?'✘ ':'')}${esc(o)}</span></div>`).join('')}
      ${ok ? '' : `<div class="mini">${my===-1 ? 'لم تُجب على هذا السؤال' : `إجابتك: <b dir="auto">${esc(q.options[my])}</b>`} — الصحيحة: <b dir="auto">${esc(q.options[correct[i]])}</b></div>`}
      ${ex[i] ? `<div class="infobox" dir="auto">${I('sparkle','s')} ${esc(ex[i])}</div>` : ''}</div>`;
  }).join('');
  openModal(`
    <h3>نتيجتك</h3>
    ${qs.auto?`<div class="infobox">${I('clock','s')} انتهى الوقت وتم تسليم إجاباتك تلقائياً.</div>`:''}
    <div class="score"><b style="color:${pct>=50?'var(--ok)':'var(--bad)'}">${score} / ${total}</b>${pct}%<div class="verdict">${verdict}</div>
      <div class="stats3"><div><b style="color:var(--ok)">${score}</b>صحيحة</div><div><b style="color:var(--bad)">${wrongN}</b>خاطئة</div><div><b>${skipN}</b>بلا إجابة</div></div></div>
    ${bad ? `<div class="rvbar"><button class="chip on" data-a="rvWrong">الأخطاء فقط (${bad})</button><button class="chip" data-a="rvAll">كل الأسئلة</button></div>` : `<div class="infobox">${I('check','s')} إجاباتك كلها صحيحة. أحسنت!</div>`}
    <div id="rv" class="${bad?'only-wrong':''}">${rows}</div>
    <div class="actions"><button class="btn lg" data-a="close">إغلاق</button></div>`, true);

}

function preview(id){
  const it = items.find(i=>i.id===id); if(!it||(!it.file_path && !it.url)) return;
  if(!it.file_path){
    openModal(`<h3 dir="auto">${esc(it.title)}</h3>${mediaHtml(embedInfo(it.url))}<div class="actions"><a class="btn sec" href="${esc(safeHref(it.url))}" target="_blank" rel="noopener noreferrer">${I('ext','s')} فتح في نافذة جديدة</a></div>`, true);
    return;
  }
  const u = esc(pubUrl(it.file_path)); const n = (it.file_name||'').toLowerCase();
  let body;
  if(n.endsWith('.pdf')) body = `<iframe class="pv" src="${u}"></iframe>`;

/* ============ الروابط والمرفقات والاستيراد ============ */
function embedInfo(u){
  u = String(u || '').trim(); if(!u) return null;
  let m;
  if((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/)))
    return { type:'youtube', embed:'https://www.youtube.com/embed/' + m[1], url:u };
  if((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)) || (m = u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/)))
    return { type:'drive', embed:'https://drive.google.com/file/d/' + m[1] + '/preview', thumb:'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200', url:u };
  if((m = u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/)))
    return { type:'drive', embed:'https://docs.google.com/' + m[1] + '/d/' + m[2] + (m[1]==='presentation' ? '/embed' : '/preview'), url:u };
  if(u.startsWith('data:image/') || /\.(png|jpe?g|gif|webp|svg)(\?|#|$)/i.test(u)) return { type:'image', embed:u, url:u };
  if(/\.pdf(\?|#|$)/i.test(u)) return { type:'pdf', embed:u, url:u };
  if(/\.(mp4|webm|ogg)(\?|#|$)/i.test(u)) return { type:'video', embed:u, url:u };
  return { type:'link', url:u };
}
const safeHref = u => /^https?:\/\//i.test(String(u||'')) ? String(u) : '#';
function mediaHtml(info){
  if(!info) return '';
  if(info.type==='youtube' || info.type==='drive')
    return `<div class="vwrap" style="border-radius:14px;overflow:hidden"><iframe src="${esc(info.embed)}" allowfullscreen loading="lazy" allow="autoplay; fullscreen"></iframe></div>`;
  if(info.type==='pdf')
    return `<iframe class="pv" src="${esc('https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(info.url))}"></iframe>`;
  if(info.type==='pdfown') return `<iframe class="pv" src="${esc(info.embed)}"></iframe>`;
  if(info.type==='image') return `<img class="pv" src="${esc(info.embed)}" alt="">`;
  if(info.type==='video') return `<video controls preload="metadata" src="${esc(info.embed)}" style="width:100%;border-radius:14px"></video>`;
  return `<a class="btn" href="${esc(safeHref(info.url))}" target="_blank" rel="noopener noreferrer">${I('ext','s')} فتح الرابط</a>`;
}
function imgSrc(s){
  s = String(s || ''); if(!s) return '';
  if(s.startsWith('data:image/')) return s;
  if(/^https?:\/\//i.test(s)){ const inf = embedInfo(s); return (inf && inf.type==='drive' && inf.thumb) ? inf.thumb : s; }
  return pubUrl(s);
}
function resBlock(x){
  const out = [];
  if(x.attach_path){
    const n = (x.attach_name || '').toLowerCase(), u = pubUrl(x.attach_path);
    const body = /\.pdf$/.test(n) ? mediaHtml({ type:'pdfown', embed:u }) : /\.(png|jpe?g|gif|webp)$/.test(n) ? mediaHtml({ type:'image', embed:u }) : '';
    out.push(`<details class="res"><summary>${I('file','s')} ملف مرفق: <b dir="auto">${esc(x.attach_name || 'ملف')}</b></summary>${body}<div class="acts"><a class="btn sec" href="${esc(pubUrl(x.attach_path, x.attach_name))}">${I('download','s')} تحميل الملف</a></div></details>`);
  }
  if(x.ext_url){
    const inf = embedInfo(x.ext_url);
    const lbl = { youtube:'فيديو يوتيوب', drive:'ملف من جوجل درايف', image:'صورة', pdf:'ملف PDF', video:'فيديو', link:'رابط خارجي' }[inf.type];
    out.push(`<details class="res"><summary>${I('link','s')} ${lbl}</summary>${mediaHtml(inf)}<div class="acts"><a class="btn sec" href="${esc(safeHref(x.ext_url))}" target="_blank" rel="noopener noreferrer">${I('ext','s')} فتح في نافذة جديدة</a></div></details>`);
  }
  return out.join('');
}

/* ---- استيراد أسئلة من ملف JSON ---- */
function parseQuizJson(txt){
  let j = JSON.parse(txt);
  if(Array.isArray(j)) j = { questions:j };
  if(!j || !Array.isArray(j.questions)) throw new Error('لا توجد قائمة questions');
  const qs = j.questions.map((x, i) => {
    const q = String(x.q ?? x.question ?? '').trim();
    const options = (x.options ?? x.choices ?? []).map(o => String(o).trim()).filter(Boolean).slice(0, 6);
    const c = x.correct ?? x.answer;
    let idx = -1;
    if(typeof c === 'number') idx = c - 1;
    else if(typeof c === 'string'){
      const s = c.trim(), k = options.findIndex(o => o === s);
      if(k >= 0) idx = k;
      else if(/^\d+$/.test(s)) idx = parseInt(s, 10) - 1;
      else if(/^[A-Fa-f]$/.test(s)) idx = s.toUpperCase().charCodeAt(0) - 65;
    }
    if(!q) throw new Error('السؤال ' + (i+1) + ': نص السؤال فارغ');
    if(options.length < 2) throw new Error('السؤال ' + (i+1) + ': يحتاج خيارين على الأقل');
    if(idx < 0 || idx >= options.length) throw new Error('السؤال ' + (i+1) + ': الإجابة الصحيحة غير محددة');
    return { q, options, correct:idx, explain:String(x.explain ?? x.explanation ?? '').trim(), image:String(x.image ?? x.img ?? '').trim() };
  });
  if(!qs.length) throw new Error('لا توجد أسئلة في الملف');
  return { title:String(j.title || ''), level:String(j.level || ''), description:String(j.description || ''), time:parseInt(j.time_limit_min ?? j.time, 10) || 0, questions:qs };
}
async function importQuizJson(file){
  if(!file) return;
  try{

    if(d.title && !$('#z_title').value.trim()) $('#z_title').value = d.title;
    if(LEVELS.includes(d.level)) $('#z_level').value = d.level;

}

  const u = r.data && r.data.user;
  if(!u) throw new Error('تعذر إنشاء الحساب');
  if(!r.data.session){ const e = new Error('confirm'); e.code = 'confirm'; throw e; }
  const p = await sb.from('profiles').insert({ id:u.id, full_name:name, login_id:login, class_id:classId || null });
  if(p.error){ await sb.rpc('admin_delete_student', { p_user:u.id }); throw p.error; }
}

function bulkForm(classId){
  openModal(`<h3>إضافة عدة طلاب دفعة واحدة</h3>
    <div class="infobox">اكتب كل طالب في سطر مستقل. يكفي كتابة الاسم، وسيُنشئ النظام اسم الدخول وكلمة المرور تلقائياً.<br>أو اكتب في السطر: <b>الاسم، اسم الدخول، كلمة المرور</b></div>
    <form id="bkf">
      <label class="f">قائمة الطلاب *</label>
      <textarea class="in" id="bk_list" dir="auto" style="min-height:190px" placeholder="أحمد محمد&#10;سارة علي&#10;محمود حسن"></textarea>
      ${clsSelect('bk_cls', classId, 'بدون صف', false)}
      <p class="note" id="bk_note">الحد الأقصى المنصوح به 25 طالباً في المرة (Supabase يسمح بنحو 30 تسجيلاً كل 5 دقائق).</p>
      <div class="actions"><button class="btn lg" id="bkbtn" type="submit">إنشاء الحسابات</button><button class="btn sec lg" type="button" data-a="close">إلغاء</button></div>
    </form>`, true);
  $('#bkf').onsubmit = async e => {
    e.preventDefault();
    const lines = $('#bk_list').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length){ toast('اكتب اسم طالب واحد على الأقل','err'); return; }
    if(lines.length > 40){ toast('الحد الأقصى 40 طالباً في المرة','err'); return; }
    const cls = $('#bk_cls').value || null;
    const taken = takenLogins(), rows = [];
    for(const line of lines){
      const p = line.split(/[,،\t]/).map(s=>s.trim());
      let login = (p[1] || '').toLowerCase();
      const pw = p[2] || genPw();
      if(!login) login = genLogin(taken);
      let bad = null;
      if(!p[0]) bad = 'الاسم فارغ';
      else if(!validLogin(login)) bad = 'اسم الدخول غير صالح';
      else if(taken.has(login)) bad = 'اسم الدخول مكرر';
      else if(pw.length < 6) bad = 'كلمة المرور أقل من 6 أحرف';
      if(bad){ rows.push({ name:p[0] || line, login, pw, ok:false, err:bad, todo:false }); continue; }
      taken.add(login);
      rows.push({ name:p[0], login, pw, ok:false, todo:true });
    }
    const btn = $('#bkbtn'); btn.disabled = true;
    let done = 0, stop = null; const total = rows.filter(r=>r.todo).length;
    for(const r of rows){
      if(!r.todo) continue;
      if(stop){ r.err = stop; continue; }
      $('#bk_note').textContent = `جارٍ الإنشاء... ${done} من ${total}`;
      try{ await createStudent({ name:r.name, login:r.login, pw:r.pw, classId:cls }); r.ok = true; }
      catch(err){
        r.err = friendlyErr(err);
        if(err && (err.code==='confirm' || /rate limit|too many|429/i.test(errMsg(err)))) stop = r.err;
      }
      done++; await new Promise(res=>setTimeout(res, 250));
    }
    await loadStudents(); render();
    credsModal(rows, `تم إنشاء ${rows.filter(r=>r.ok).length} من ${rows.length} حساب`);
  };
}

/* ---------- جرس تنبيهات المعلم ---------- */
let bell = { items:[], started:false, last:0, noRpc:false };
const BELL_SEEN = 'fo_bell_seen', BELL_DIS = 'fo_bell_dis';
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
function bellDismissed(){ try{ return JSON.parse(lsGet(BELL_DIS)||'[]'); }catch(e){ return []; } }
function bellBadge(){
  const n = bell.items.length, el = document.getElementById('bellN');
  if(el){ el.textContent = n > 99 ? '99+' : n; el.hidden = !n; }
  document.title = (n ? '(' + n + ') ' : '') + document.title.replace(/^\(\d+\)\s*/, '');
}
async function bellLoad(){
  if(!state.teacher || !sb) return;
  let seen = lsGet(BELL_SEEN);
  if(!seen){ seen = new Date().toISOString(); lsSet(BELL_SEEN, seen); }
  const [r, s, g, u] = await Promise.all([
    sb.from('results').select('id,student,student_id,quiz_id,score,total,created_at').gt('created_at', seen).order('created_at',{ascending:false}).limit(50),
    sb.from('submissions').select('id,student,student_id,assignment_id,created_at').gt('created_at', seen).order('created_at',{ascending:false}).limit(50),
    sb.from('game_scores').select('id,student_id,game,level,correct,total,created_at').gt('created_at', seen).order('created_at',{ascending:false}).limit(50),
    bell.noRpc ? Promise.resolve({ data:[], error:null }) : sb.rpc('unknown_accounts')
  ]);
  if(u.error) bell.noRpc = true;
  const nm = id => ((students.find(x=>x.id===id)||{}).full_name) || '';
  const items = [];
  const dis = new Set(bellDismissed());
  (Array.isArray(u.data) ? u.data : []).forEach(a => {
    if(dis.has(a.id)) return;
    if(Date.now() - new Date(a.created_at).getTime() < 3*60000) return; // إنشاء طالب جارٍ الآن
    items.push({ t:'unknown', id:a.id, time:a.created_at, a });
  });
  (s.data||[]).forEach(x => items.push({ t:'sub', id:x.id, time:x.created_at, text:`${x.student || nm(x.student_id) || 'طالب'} سلّم واجباً: ${(assignments.find(a=>a.id===x.assignment_id)||{title:'واجب'}).title}` }));
  (r.data||[]).forEach(x => items.push({ t:'quiz', id:x.id, time:x.created_at, text:`${x.student || nm(x.student_id) || 'طالب'} أنهى اختباراً: ${(quizzes.find(z=>z.id===x.quiz_id)||{title:'اختبار'}).title} (${x.score}/${x.total})` }));
  (g.data||[]).forEach(x => items.push({ t:'game', id:x.id, time:x.created_at, text:`${nm(x.student_id) || 'طالب'} لعب ${(GAME_DATA[x.game]||{}).title || x.game} ${x.level} (${x.correct}/${x.total})` }));
  items.sort((a,b)=> (a.t==='unknown'?0:1) - (b.t==='unknown'?0:1) || b.time.localeCompare(a.time));
  const prev = bell.items.length, hadUnknown = bell.items.filter(i=>i.t==='unknown').map(i=>i.id);
  bell.items = items; bell.last = Date.now(); bellBadge();
  const newUnknown = items.filter(i=>i.t==='unknown' && !hadUnknown.includes(i.id));
  if(bell.started === 2 && newUnknown.length) toast('⚠ حساب غير معروف سُجّل في الموقع', 'err');
  else if(bell.started === 2 && items.length > prev) toast('🔔 تنبيه جديد', 'ok');
  bell.started = 2;
}
function bellStart(){
  if(bell.started || !state.teacher) return;
  bell.started = 1; bellLoad(); setInterval(() => { if(!document.hidden) bellLoad(); }, 90000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden && Date.now() - bell.last > 20000) bellLoad(); });
}
function bellOpen(){
  const ic = { unknown:['bell','c-red'], sub:['assign','c-orange'], quiz:['quiz','c-green'], game:['sparkle','c-purple'] };
  const rows = bell.items.map(i => i.t === 'unknown'

        <div class="row"><button class="btn sec" data-a="bellDis" data-id="${i.id}">أعرفه، تجاهل</button><button class="btn del" data-a="bellDel" data-id="${i.id}">حذف الحساب</button></div></div></div>`
    : `<div class="bitem"><div class="bi ${ic[i.t][1]}">${I(ic[i.t][0])}</div><div class="bt"><b dir="auto">${esc(i.text)}</b><small>${fmtDT(i.time)}</small></div></div>`).join('');
  openModal(`<h3>${I('bell')} التنبيهات</h3>

let trk = { cls:'all', data:null };
async function loadTrack(){
  const [r, s, g] = await Promise.all([
    sb.from('results').select('id,quiz_id,student,student_id,score,total,created_at').order('created_at',{ascending:false}),
    sb.from('submissions').select('id,assignment_id,student,student_id,grade,note,created_at').order('created_at',{ascending:false}),
    sb.from('game_scores').select('id,student_id,game,level,correct,total,created_at').order('created_at',{ascending:false}).limit(5000)
  ]);
  const bad = r.error || s.error;
  trk.data = bad ? null : { results:r.data||[], subs:s.data||[], games:g.error ? [] : (g.data||[]), gOk:!g.error };
  return bad ? errMsg(bad) : '';
}
async function renderTrack(v, err){
  v.innerHTML = err + skel();
  const e = await loadTrack();
  if(state.tab !== 'track') return;
  if(e){ v.innerHTML = err + `<div class="errbox">تعذر تحميل بيانات المتابعة: ${esc(e)}</div>`; return; }
  drawTrack(v, err);
}
function trkStats(){
  const { results, subs, games } = trk.data;
  const list = students.filter(s => trk.cls==='all' || (trk.cls==='none' ? !s.class_id : s.class_id===trk.cls));
  const ids = new Set(list.map(s=>s.id));
  const rs = results.filter(r => ids.has(r.student_id)), ss = subs.filter(x => ids.has(x.student_id)), gs = games.filter(x => ids.has(x.student_id));
  const pct = r => r.total ? r.score/r.total*100 : 0;
  const rows = list.map(s => {
    const a = rs.filter(r=>r.student_id===s.id), b = ss.filter(x=>x.student_id===s.id);
    const avg = a.length ? a.reduce((n,r)=>n+pct(r),0)/a.length : null;
    const g = gs.filter(x=>x.student_id===s.id);
    const gavg = g.length ? g.reduce((n,x)=>n+x.correct/x.total*100,0)/g.length : null;
    const last = [...a.map(r=>r.created_at), ...b.map(x=>x.created_at), ...g.map(x=>x.created_at)].sort().pop() || null;
    return { s, a, b, g, gavg, avg, last, ungraded:b.filter(x=>!x.grade).length };
  });
  const dayAgo = d => (Date.now() - new Date(d).getTime()) / 86400000;
  return { list, rs, ss, gs, rows, pct, inactive: rows.filter(r => !r.last || dayAgo(r.last) > 14).length };
}
function drawTrack(v, err){
  if(state.tab !== 'track') return;
  const st = trkStats(), cname = id => (classes.find(c=>c.id===id)||{}).name || '—';
  const avgAll = st.rs.length ? Math.round(st.rs.reduce((n,r)=>n+st.pct(r),0)/st.rs.length) : null;
  const ungr = st.ss.filter(x=>!x.grade).length;
  const tiles = [
    ['users','c-blue',st.list.length,'طالب'], ['quiz','c-green',st.rs.length,'محاولة اختبار'],
    ['chart','c-purple',avgAll==null?'—':avgAll+'%','متوسط الدرجات'], ['assign','c-orange',ungr,'واجب بانتظار التصحيح'],
    ['sparkle','c-purple',st.gs.length,'جولة لعب'], ['clock','c-teal',st.inactive,'لم يتفاعل منذ 14 يوماً']
  ];
  const bar = p => `<span class="pbar ${p<50?'low':''}"><i style="width:${Math.round(p)}%"></i></span>`;
  const rowsSorted = st.rows.slice().sort((x,y)=> (x.avg==null) - (y.avg==null) || (x.avg||0) - (y.avg||0));
  const quizRows = quizzes.map(z => {
    const a = st.rs.filter(r=>r.quiz_id===z.id);
    return { z, n:a.length, avg:a.length ? a.reduce((n,r)=>n+st.pct(r),0)/a.length : null };
  }).filter(x=>x.n).sort((x,y)=>x.avg-y.avg);
  const asgRows = assignments.map(a => {
    const b = st.ss.filter(x=>x.assignment_id===a.id);
    return { a, n:b.length, un:b.filter(x=>!x.grade).length };
  }).filter(x=>x.n);
  const opts = `<option value="all">كل الصفوف</option>` + classes.map(c=>`<option value="${c.id}" ${trk.cls===c.id?'selected':''}>${esc(c.name)}</option>`).join('') + `<option value="none" ${trk.cls==='none'?'selected':''}>بدون صف</option>`;
  v.innerHTML = err + `
    <h2 class="st"><span>${I('chart')} متابعة الطلاب</span><small>${st.list.length}</small></h2>
    <div class="trk-bar"><select class="in" data-a="trkCls" aria-label="الصف">${opts}</select><button class="btn sec" data-a="trkRefresh">تحديث</button></div>
    <div class="tiles">${tiles.map(([ic,col,n,l])=>`<div class="tile static"><div class="ib ${col}">${I(ic)}</div><div><b>${n}</b><span>${l}</span></div></div>`).join('')}</div>

    <h2 class="st"><span>${I('users')} الطلاب</span><small>الأضعف أولاً — اضغط على طالب للتفاصيل</small></h2>
    ${st.list.length ? `<div class="card" style="padding:6px 14px;overflow-x:auto"><table><tr><th>الطالب</th><th>الصف</th><th>المحاولات</th><th>متوسط الدرجات</th><th>الواجبات</th><th>الألعاب</th><th>آخر نشاط</th></tr>
      ${rowsSorted.map(x=>`<tr class="rowopen" data-a="trkOpen" data-id="${x.s.id}"><td data-label="الطالب" dir="auto"><b>${esc(x.s.full_name)}</b></td><td data-label="الصف">${esc(cname(x.s.class_id))}</td><td data-label="المحاولات">${x.a.length}</td>
        <td data-label="المتوسط">${x.avg==null?'<span class="tag warn">لم يبدأ</span>':Math.round(x.avg)+'%'+bar(x.avg)}</td>
        <td data-label="الواجبات">${x.b.length}${x.ungraded?` <span class="tag warn">${x.ungraded} بلا تصحيح</span>`:''}</td><td data-label="الألعاب">${x.g.length ? x.g.length + ' · ' + Math.round(x.gavg) + '%' : '—'}</td><td data-label="آخر نشاط">${x.last?fmtDT(x.last):'—'}</td></tr>`).join('')}</table></div>`
      : emptyBox('users','c-blue','لا يوجد طلاب في هذا الاختيار','')}

    <h2 class="st"><span>${I('quiz')} الاختبارات</span><small>الأصعب أولاً</small></h2>
    ${quizRows.length ? `<div class="card" style="padding:6px 14px;overflow-x:auto"><table><tr><th>الاختبار</th><th>المحاولات</th><th>المتوسط</th></tr>

      : emptyBox('quiz','c-green','لا توجد محاولات بعد','ستظهر هنا نتائج الطلاب عند حلّهم الاختبارات.')}

    <h2 class="st"><span>${I('assign')} الواجبات</span></h2>
    ${asgRows.length ? `<div class="card" style="padding:6px 14px;overflow-x:auto"><table><tr><th>الواجب</th><th>التسليمات</th><th>بانتظار التصحيح</th></tr>

const GAME_EN_R = [[/^السؤال (\d+) من (\d+)$/,"Question $1 of $2"],[/^الكلمة الصحيحة: (.*)$/,"Correct word: $1"],[/^الجملة الصحيحة: (.*)$/,"Correct sentence: $1"],[/^الكلمة المنطوقة: (.*)$/,"Spoken word: $1"],[/^الكلمة: (.*)$/,"Word: $1"],[/^الإجابة الصحيحة: (.*)$/,"Correct answer: $1"],[/^انتبه للحروف المشكَّلة \(الأكسنت\)\. الصحيح: (.*)$/,"Watch the accents. Correct: $1"],[/^أفضل نتيجة: (\d+)$/,"Best score: $1"],[/^أفضل نتيجة سابقة: (\d+)$/,"Previous best: $1"],[/^(\d+)ث$/,"$1s"]];
function trText(s){
  if(G.lang!=='en') return s;
  const lead = s.match(/^\s*/)[0], trail = s.match(/\s*$/)[0], t = s.trim();
  if(!t || !/[\u0600-\u06FF]/.test(t)) return s;
  const one = x => { if(GAME_EN[x]!==undefined) return GAME_EN[x]; for(const [re,r] of GAME_EN_R){ if(re.test(x)) return x.replace(re,r); } return x; };
  return lead + t.split(/( — | · )/).map((x,i)=>i%2?x:one(x)).join('') + trail;
}
function trDom(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), ns = [];
  while(w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n => { if(n.parentElement && n.parentElement.closest('[data-notr]')) return; const v = trText(n.nodeValue); if(v!==n.nodeValue) n.nodeValue = v; });
  root.querySelectorAll('[aria-label],[placeholder]').forEach(el => ['aria-label','placeholder'].forEach(a => { const x = el.getAttribute(a); if(x) el.setAttribute(a, trText(x)); }));
}

const giStr = (x, max, what, req) => { x = String(x==null?'':x).trim(); if(req && !x) throw new Error('الحقل مطلوب: ' + what); if(x.length > max) throw new Error('النص طويل جداً: ' + what); return x; };

function giValidate(game, d){
  if(!d || typeof d !== 'object') throw new Error('بيانات غير صالحة');
  const o = {};
  const four = () => { const a = Array.isArray(d.o) ? d.o.map(x=>giStr(x,120,'الخيار',true)) : []; if(a.length!==4) throw new Error('يجب أن تكتب أربعة خيارات بالضبط'); if(new Set(a).size!==4) throw new Error('الخيارات يجب ألا تتكرر'); return a; };
  const idx = () => { const n = Number(d.a); if(!Number.isInteger(n) || n<0 || n>3) throw new Error('اختر رقم الإجابة الصحيحة من 1 إلى 4'); return n; };
  switch(game){
    case 'mcq': o.q = giStr(d.q,300,'السؤال',true); o.o = four(); o.a = idx(); break;
    case 'odd': o.o = four(); o.a = idx(); if(d.q) o.q = giStr(d.q,200,'السؤال'); break;
    case 'listen': o.w = giStr(d.w,40,'الكلمة المنطوقة',true); o.o = four(); if(o.o[0]!==o.w) throw new Error('الخيار الأول يجب أن يكون الكلمة المنطوقة نفسها'); break;
    case 'tf': o.q = giStr(d.q,300,'العبارة',true); if(typeof d.a!=='boolean') throw new Error('حدّد هل العبارة صحيحة أم خاطئة'); o.a = d.a; break;

    case 'order': o.w = giStr(d.w,120,'الجملة',true); { const n = o.w.split(' ').filter(Boolean).length; if(n<3 || n>9) throw new Error('الجملة يجب أن تكون من 3 إلى 9 كلمات'); o.w = o.w.split(' ').filter(Boolean).join(' '); } o.h = giStr(d.h,160,'الترجمة/التلميح',true); break;
    case 'match': o.f = giStr(d.f,40,'الكلمة الفرنسية',true); o.m = giStr(d.m,60,'المعنى',true); break;
    case 'fill': o.q = giStr(d.q,200,'الجملة',true); if(!o.q.includes('___')) throw new Error('ضع ___ (ثلاث شرطات سفلية) مكان الكلمة الناقصة'); o.a = (Array.isArray(d.a)?d.a:[]).map(x=>giStr(x,60,'الإجابة',true)); if(!o.a.length) throw new Error('اكتب إجابة واحدة صحيحة على الأقل'); break;
    default: throw new Error('نوع لعبة غير معروف');
  }
  if(game!=='listen'){ const e = giStr(d.e,300,'الشرح'); if(e) o.e = e; }
  if(d.en && typeof d.en==='object'){
    const en = {};
    GI_EN_KEYS[game].forEach(k => {
      const x = d.en[k]; if(x==null || x==='' || (Array.isArray(x) && !x.length)) return;
      if(k==='o'){ if(!Array.isArray(x) || x.length!==4) throw new Error('الترجمة الإنجليزية للخيارات يجب أن تكون أربعة أسطر'); en.o = x.map(y=>giStr(y,120,'English option',true)); }
      else en[k] = giStr(x,300,'English text');
    });
    if(Object.keys(en).length) o.en = en;
  }
  return o;
}
function giToEngine(it){
  const d = it.data || {};
  switch(it.game){
    case 'mcq': return { q:d.q, o:d.o, a:d.a, e:d.e||'' };
    case 'odd': return { q:d.q, o:d.o, a:d.a, e:d.e||'' };
    case 'listen': return { w:d.w, o:d.o };
    case 'tf': return { q:d.q, a:d.a, e:d.e||'' };
    case 'scramble': case 'order': return { w:d.w, h:d.h };
    case 'match': return { f:d.f, m:d.m };
    case 'fill': return { q:d.q, a:d.a, e:d.e||'' };
  }
  return null;
}
function giReg(){
  const reg = (ar, en) => { if(ar && en) GAME_EN[ar] = en; };
  gameItems.forEach(it => {
    const d = it.data || {}, en = d.en; if(!en) return;

    if(a.k===b.k){ m.done.push(a.k); m.open = []; beep('ok'); if(m.done.length===G.qs.length){ render(); return memEnd(); } }
    else { m.lock = true; render(); setTimeout(()=>{ if(G.mem===m){ m.open = []; m.lock = false; render(); } }, 900); return; }
  }
  render();
}
function memEnd(){
  const n = G.qs.length, m = G.mem, extra = Math.max(0, m.moves - n);
  G.ok = Math.max(1, n - Math.floor(extra/2)); G.pts = Math.max(0, n*10 - extra*3); G.stat3 = [m.moves,'محاولات'];
  G.tot = Math.round((Date.now()-G.tot)/1000);
  const b = getBest(); G.newBest = G.pts > b; if(G.newBest) setBest(G.pts); G.prevBest = b; if(extra===0) beep('win'); gSaveScore();
  setTimeout(()=>{ if(G.mem===m){ G.view = 'end'; render(); } }, 700);
}
function matchEnd(){
  const n = G.qs.length; G.ok = Object.values(G.m.first).filter(Boolean).length;
  G.pts = Math.max(0, n*10 - G.m.err*4); G.stat3 = [G.m.err,'أخطاء'];
  G.view = 'end'; G.tot = Math.round((Date.now()-G.tot)/1000);
  const b = getBest(); G.newBest = G.pts > b; if(G.newBest) setBest(G.pts); G.prevBest = b; if(G.m.err===0) beep('win'); gSaveScore(); render();
}
async function gSaveScore(){
  try{
    if(G.saved || typeof sb === 'undefined' || !sb || state.teacher || !(state.me && state.me.student)) return;
    const total = G.qs.length, correct = Math.max(0, Math.min(G.ok, total)); if(!total) return;
    G.saved = true;
    await sb.from('game_scores').insert({ game:G.game, level:G.level, correct, total });
  }catch(e){}
}
function gameNext(){
  if(G.view!=='play' || G.pick===null) return;
  if(G.i+1 >= G.qs.length){
    G.view = 'end'; G.tot = Math.round((Date.now()-G.tot)/1000);
    const b = getBest(); G.newBest = G.pts > b; if(G.newBest) setBest(G.pts);
    G.prevBest = b; if(G.ok === G.qs.length) beep('win'); gSaveScore();
  } else { G.i++; G.pick = null; G.t0 = Date.now(); G.sel = []; G.val = ''; G.close = ''; G.hg = { g:[], wrong:0 }; }
  render(); window.scrollTo(0,0);
}

document.addEventListener('keydown', e => {
  if(state.tab!=='games' || G.view!=='play' || e.ctrlKey || e.metaKey || e.altKey) return;
  if(document.querySelector('#modal .ov') || /INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'')) return;
  if(G.game==='fill' && G.pick===null){ if(e.key==='Enter'){ e.preventDefault(); fillCheck(); } return; }
  if(G.game==='hangman'){ if(G.pick===null && /^[a-zA-Z]$/.test(e.key)) hgKey(e.key.toLowerCase()); else if(e.key==='Enter' && G.pick!==null){ e.preventDefault(); gameNext(); } return; }
  if(G.game==='scramble' || G.game==='order' || G.game==='match' || G.game==='memory') { if(e.key==='Enter' && G.pick!==null){ e.preventDefault(); gameNext(); } else if(e.key==='Backspace') scrBack(); return; }
  if(/^[1-4]$/.test(e.key)) gameAnswer(+e.key-1);
  else if(e.key==='Enter' && G.pick!==null){ e.preventDefault(); gameNext(); }
});

/* ---------- المفردات ---------- */
const V = { view:'menu', level:'A1', cat:null, mean:'ar', q:'', deck:[], i:0, flip:false, total:0, again:0, known:new Set() };
(function(){
  try{ const p = JSON.parse(localStorage.getItem('fo_voc_pref')||'{}'); if(['A1','A2','B1'].includes(p.level)) V.level = p.level; if(['ar','en','both'].includes(p.mean)) V.mean = p.mean; }catch(e){}
  try{ V.known = new Set(JSON.parse(localStorage.getItem('fo_voc_known')||'[]')); }catch(e){}
})();
function vSave(){
  try{ localStorage.setItem('fo_voc_pref', JSON.stringify({ level:V.level, mean:V.mean })); localStorage.setItem('fo_voc_known', JSON.stringify([...V.known])); }catch(e){}
}
const vCats = () => VOC[V.level] || [];
const vCat = id => vCats().find(c => c.id === id);
function vMean(w){
  const ar = `<span class="vm">${esc(w[1])}</span>`, en = `<span class="vm" dir="ltr">${esc(w[2])}</span>`;
  return '<span class="vmw">' + (V.mean === 'ar' ? ar : V.mean === 'en' ? en : ar + ' <span class="vsep">·</span> ' + en) + '</span>';
}
const vFr = w => `<span class="vfr" dir="ltr" lang="fr">${esc(w[0])}</span>`;
const vSay = w => speak(w[0].replace(/[…()]/g, '').replace(/\bpl\.[^)]*/, ''), .85);
function vProg(c){ const k = c.w.filter(w => V.known.has(w[0])).length; return { k, n:c.w.length, p:Math.round(k / c.w.length * 100) }; }
function vSearchHtml(){
  const q = V.q.trim().toLowerCase();
  if(!q){
    return `<div class="vgrid">${vCats().map(c => { const p = vProg(c); return `<button class="vcat" data-a="vOpen" data-id="${c.id}"><b>${esc(c.ar)}</b><span class="vf" dir="ltr">${esc(c.fr)}</span><span class="vn" dir="ltr">${p.k} / ${p.n}</span><span class="vbar"><i style="width:${p.p}%"></i></span></button>`; }).join('')}</div>`;
  }
  const hits = [];
  vCats().forEach(c => c.w.forEach((w, i) => { if(w.some(x => x.toLowerCase().includes(q))) hits.push({ c, w, i }); }));
  if(!hits.length) return `<div class="empty" style="border:0"><h4>لا توجد نتائج</h4><p>جرّب كلمة أخرى أو غيّر المستوى.</p></div>`;
  return `<div class="card vlist">${hits.slice(0, 60).map(h => `<div class="vrow"><button class="vsp" data-a="vSayW" data-id="${h.c.id}" data-i="${h.i}" aria-label="استمع">${I('play','s')}</button><div class="vtx">${vFr(h.w)}${vMean(h.w)}</div><span class="vtag">${esc(h.c.ar)}</span></div>`).join('')}</div>${hits.length > 60 ? '<p class="cap">أول 60 نتيجة. دقّق البحث للمزيد.</p>' : ''}`;
}
function renderVocab(v){
  v.dir = '';
  if(V.view === 'cards') return renderVCards(v);
  if(V.view === 'cat') return renderVCat(v);
  const pills = ['A1','A2','B1'].map(l => `<button class="vpill ${V.level === l ? 'on' : ''}" data-a="vLevel" data-id="${l}">${l}</button>`).join('');
  const means = [['ar','عربي'],['en','English'],['both','الاثنان']].map(([k, l]) => `<button class="vpill sm ${V.mean === k ? 'on' : ''}" data-a="vMean" data-id="${k}">${l}</button>`).join('');
  const all = vCats().reduce((n, c) => n + c.w.length, 0), kn = vCats().reduce((n, c) => n + vProg(c).k, 0);
  v.innerHTML = `<h2 class="st"><span>${I('vocab')} المفردات <small>Vocabulaire</small></span></h2>
    <div class="vbar2"><div class="vpills">${pills}</div><div class="vpills">${means}</div></div>
    <input class="in vq" id="vq" type="search" placeholder="ابحث عن كلمة بالفرنسية أو العربية أو الإنجليزية" value="${esc(V.q)}" autocomplete="off">
    <p class="cap" style="margin:8px 2px 14px">${kn} من ${all} كلمة وضعت عليها علامة «عرفتها» في هذا المستوى.</p>
    <div id="vres">${vSearchHtml()}</div>`;
}
function renderVCat(v){
  const c = vCat(V.cat); if(!c){ V.view = 'menu'; return renderVocab(v); }
  const p = vProg(c), means = [['ar','عربي'],['en','English'],['both','الاثنان']].map(([k, l]) => `<button class="vpill sm ${V.mean === k ? 'on' : ''}" data-a="vMean" data-id="${k}">${l}</button>`).join('');
  v.innerHTML = `<button class="btn sec" data-a="vBack" style="margin-bottom:12px">← المفردات</button>
    <h2 class="st"><span>${esc(c.ar)} <small dir="ltr">${esc(c.fr)}</small></span><small dir="ltr">${p.k} / ${p.n}</small></h2>
    <div class="vbar2"><div class="vpills">${means}</div><button class="btn" data-a="vCards">${I('play','s')} بطاقات المراجعة</button></div>
    <div class="card vlist">${c.w.map((w, i) => `<div class="vrow ${V.known.has(w[0]) ? 'ok' : ''}"><button class="vsp" data-a="vSayW" data-id="${c.id}" data-i="${i}" aria-label="استمع">${I('play','s')}</button><div class="vtx">${vFr(w)}${vMean(w)}</div><button class="vk ${V.known.has(w[0]) ? 'on' : ''}" data-a="vKnow" data-i="${i}" aria-pressed="${V.known.has(w[0])}">${V.known.has(w[0]) ? '✓ عرفتها' : 'عرفتها؟'}</button></div>`).join('')}</div>`;
}
function renderVCards(v){
  const c = vCat(V.cat); if(!c){ V.view = 'menu'; return renderVocab(v); }
  if(!V.deck.length){
    v.innerHTML = `<div class="card gend" style="text-align:center;padding:34px 18px"><div class="eic c-green" style="margin:0 auto 10px">${I('check')}</div><h3>أحسنت! أنهيت المراجعة</h3>
      <p class="cap">راجعت ${V.total} كلمة${V.again ? ` وأعدت ${V.again} منها` : ' دون أي إعادة'}.</p>
      <div class="actions" style="justify-content:center"><button class="btn lg" data-a="vCards">راجع مرة أخرى</button><button class="btn sec lg" data-a="vCatBack">رجوع للقائمة</button></div></div>`;
    return;
  }
  const w = V.deck[0], done = V.total - V.deck.length;
  v.innerHTML = `<button class="btn sec" data-a="vCatBack" style="margin-bottom:12px">← ${esc(c.ar)}</button>
    <div class="vprog"><span dir="ltr">${done} / ${V.total}</span><span class="vbar"><i style="width:${Math.round(done / V.total * 100)}%"></i></span></div>
    <button class="vcard ${V.flip ? 'flip' : ''}" data-a="vFlip" aria-label="اقلب البطاقة">
      ${V.flip ? `<span class="vmean">${vMean(w)}</span><span class="vhint">${vFr(w)}</span>` : `${vFr(w)}<span class="vhint">اضغط لإظهار المعنى</span>`}
    </button>
    <div class="actions" style="justify-content:center"><button class="btn sec lg" data-a="vSayC">${I('play','s')} استمع</button>
      ${V.flip ? `<button class="btn del lg" data-a="vNo">أعيدها</button><button class="btn lg" data-a="vYes">عرفتها ✓</button>` : `<button class="btn lg" data-a="vFlip">أظهر المعنى</button>`}</div>`;
}
function vStartCards(){
  const c = vCat(V.cat); if(!c) return;
  let ws = c.w.filter(w => !V.known.has(w[0])); if(!ws.length) ws = c.w.slice();
  for(let i = ws.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [ws[i], ws[j]] = [ws[j], ws[i]]; }
  V.deck = ws; V.total = ws.length; V.again = 0; V.flip = false; V.view = 'cards'; render(); window.scrollTo(0, 0);
}
const VH = {
  vLevel:(id) => { V.level = id; V.q = ''; vSave(); render(); },
  vMean:(id) => { V.mean = id; vSave(); render(); },
  vOpen:(id) => { V.cat = id; V.view = 'cat'; render(); window.scrollTo(0, 0); },
  vBack:() => { V.view = 'menu'; render(); },
  vCatBack:() => { V.view = 'cat'; render(); },
  vSayW:(id, el) => { const c = vCat(id); if(c) vSay(c.w[+el.dataset.i]); },
  vKnow:(id, el) => { const c = vCat(V.cat); if(!c) return; const w = c.w[+el.dataset.i]; V.known.has(w[0]) ? V.known.delete(w[0]) : V.known.add(w[0]); vSave(); render(); },
  vCards:() => vStartCards(),
  vFlip:() => { V.flip = !V.flip; render(); },
  vSayC:() => { if(V.deck[0]) vSay(V.deck[0]); },
  vYes:() => { const w = V.deck.shift(); if(w) V.known.add(w[0]); V.flip = false; vSave(); render(); },
  vNo:() => { const w = V.deck.shift(); if(w){ V.deck.push(w); V.again++; } V.flip = false; render(); }
};
document.addEventListener('input', e => {
  if(e.target && e.target.id === 'vq'){ V.q = e.target.value; const r = document.getElementById('vres'); if(r) r.innerHTML = vSearchHtml(); }
});

 ex:[["Il ne mange pas.","هو لا يأكل.|He is not eating."],["Je n'ai pas de voiture.","ليست عندي سيارة.|I don't have a car."],["Nous ne sommes pas fatigués.","لسنا متعبين.|We are not tired."]],

 ["Choisissez la phrase correcte:",["Il pas mange.","Il ne mange pas.","Il mange ne pas."],1,"ne قبل الفعل و pas بعده.|Ne before the verb, pas after."],
 ["Nous ___ travaillons pas le dimanche.",["ne","n'","non"],0,"travaillons يبدأ بحرف ساكن: ne.|Travaillons starts with a consonant: ne."],
 ["Tu ___ pas content.",["n'es","ne es","n'est"],0,"مع tu: tu es ← tu n'es pas.|With tu: tu es ← tu n'es pas."],
 ["Ils ne ___ pas ici.",["habite","habitent","habitons"],1,"مع ils النهاية -ent.|With ils the ending is -ent."],
 ["Il n'y a pas ___ eau.",["de l'","d'","de la"],1,"بعد النفي de تصبح d' أمام حرف متحرك: d'eau.|After a negation de becomes d' before a vowel: d'eau."]]},

 ["Le pluriel de «un gâteau» est:",["des gâteaus","des gâteaux","des gâteau"],1,"-eau تأخذ x في الجمع.|-eau takes x in the plural."],

 ["«Parles-tu arabe ?» signifie:",["هل تتكلم العربية؟","أنا أتكلم العربية.","لا أتكلم العربية."],0,"قلب الفعل والضمير يعطي سؤالاً.|Inversion makes a question."],

 ["___ est-ce que tu habites ? (أين)",["Où","Quand","Qui"],0,"où = أين.|Où = where."],
