{id:"a2-etre",ar:"الماضي المركب بفعل الكينونة",en:"Past tense with être",fr:"Le passé composé avec être",
 intro:"مجموعة من أفعال الحركة والتغيّر تُصرَّف مع être بدل avoir، ويتفق اسم المفعول مع الفاعل.|A group of movement and change verbs use être instead of avoir, and the participle agrees with the subject.",
 rules:["الأفعال الأشهر: aller, venir, arriver, partir, entrer, sortir, monter, descendre, rester, naître, mourir, tomber, retourner.|Most common: aller, venir, arriver, partir, entrer, sortir, monter, descendre, rester, naître, mourir, tomber, retourner.","كل الأفعال الانعكاسية (se lever, se laver...) تُصرَّف مع être.|All reflexive verbs (se lever, se laver...) use être.","الاتفاق: للمؤنث نضيف e وللجمع s: Elle est allée. Ils sont partis.|Agreement: add e for feminine and s for plural: Elle est allée. Ils sont partis."],
 ex:[["Je suis allé au marché.","ذهبت إلى السوق.|I went to the market."],["Elle est arrivée hier.","وصلت البارحة.|She arrived yesterday."],["Nous sommes restés à la maison.","بقينا في البيت.|We stayed at home."]],
 quiz:[["Hier, Marie ___ au cinéma.",["a allé","est allée","est allé"],1,"aller مع être، والفاعل مؤنث: est allée.|Aller uses être and the subject is feminine: est allée."],
 ["Ils ___ partis à huit heures.",["ont","sont","est"],1,"partir مع être: ils sont partis.|Partir uses être: ils sont partis."],
 ["Choisissez la phrase correcte:",["J'ai arrivé en retard.","Je suis arrivé en retard.","Je arrivé en retard."],1,"arriver مع être.|Arriver uses être."],
 ["Nous ___ levés tôt.",["avons","sommes","nous sommes"],2,"الانعكاسية: nous nous sommes levés.|Reflexive: nous nous sommes levés."],
 ["Elles ___ arrivées.",["sont","ont","est"],0,"arriver مع être: elles sont arrivées.|Arriver uses être."],
 ["Je ___ tombée. (امرأة تتكلم)",["suis","ai","est"],0,"tomber مع être: je suis tombée.|Tomber uses être: je suis tombée."],
 ["Il ___ sorti à six heures.",["est","a","as"],0,"sortir مع être.|Sortir uses être."],
 ["Mes amis ___ restés à la maison.",["sont","ont","est"],0,"rester مع être: sont restés.|Rester uses être: sont restés."]]},
{id:"a2-fp",ar:"المستقبل القريب",en:"The near future",fr:"Le futur proche",
 intro:"للتعبير عمّا سيحدث قريباً: aller في الحاضر + المصدر (infinitif).|To say what is going to happen soon: aller in the present + the infinitive.",
 table:{h:["الضمير|Pronoun","aller"],r:[["je","vais"],["tu","vas"],["il / elle / on","va"],["nous","allons"],["vous","allez"],["ils / elles","vont"]]},
 rules:["النفي حول aller: Je ne vais pas partir.|Negation goes around aller: Je ne vais pas partir.","الفعل الثاني يبقى مصدراً دائماً: Nous allons manger.|The second verb always stays in the infinitive: Nous allons manger."],
 ex:[["Demain, je vais travailler.","غداً سأعمل.|Tomorrow I am going to work."],["Ils vont arriver bientôt.","سيصلون قريباً.|They are going to arrive soon."],["Tu vas voyager ?","هل ستسافر؟|Are you going to travel?"]],
 quiz:[["Ce soir, nous ___ regarder un film.",["allons","allez","vont"],0,"مع nous: allons.|With nous: allons."],
 ["Elle va ___.",["partir","part","partie"],0,"بعد aller نضع المصدر.|After aller use the infinitive."],
 ["Ils ___ voyager en été.",["va","vont","allons"],1,"مع ils: vont.|With ils: vont."],
 ["Je ne ___ pas manger.",["vais","vas","va"],0,"مع je: vais.|With je: vais."],
 ["Tu ___ faire tes devoirs ?",["vas","va","vais"],0,"مع tu: vas.|With tu: vas."],
 ["Nous ___ prendre le train.",["allons","allez","vont"],0,"مع nous: allons.|With nous: allons."],
 ["Elle va ___ un gâteau.",["faire","fait","fais"],0,"بعد aller المصدر: faire.|After aller the infinitive: faire."],
 ["Le futur proche se forme avec:|The near future is formed with:",["aller + infinitif","avoir + infinitif","être + participe"],0,"aller + مصدر.|Aller + infinitive."]]},
{id:"a2-pron",ar:"الأفعال الانعكاسية",en:"Reflexive verbs",fr:"Les verbes pronominaux",
 intro:"أفعال يرافقها ضمير إضافي (me, te, se, nous, vous, se) يعود على الفاعل، مثل se lever (ينهض).|Verbs accompanied by an extra pronoun (me, te, se, nous, vous, se) that refers back to the subject, like se lever (to get up).",
 table:{h:["الضمير|Pronoun","se lever"],r:[["je","me lève"],["tu","te lèves"],["il / elle / on","se lève"],["nous","nous levons"],["vous","vous levez"],["ils / elles","se lèvent"]]},
 rules:["الضمير الانعكاسي قبل الفعل مباشرة.|The reflexive pronoun comes right before the verb.","me و te و se تصبح m' و t' و s' أمام حرف متحرك: je m'habille.|Me, te, se become m', t', s' before a vowel: je m'habille.","أفعال شائعة: se réveiller, se laver, s'habiller, se coucher, se promener, s'appeler.|Common: se réveiller, se laver, s'habiller, se coucher, se promener, s'appeler."],
 ex:[["Je me réveille à sept heures.","أستيقظ في السابعة.|I wake up at seven."],["Elle s'appelle Sara.","اسمها سارة.|Her name is Sara."],["Nous nous promenons le soir.","نتنزه في المساء.|We go for a walk in the evening."]],
 quiz:[["Tu ___ à quelle heure ?",["te lèves","se lèves","me lèves"],0,"مع tu الضمير te.|With tu the pronoun is te."],
 ["Je ___ habille.",["me","m'","se"],1,"habille يبدأ بحرف متحرك: m'.|Habille starts with a vowel: m'."],
 ["Ils ___ couchent tard.",["se","nous","te"],0,"مع ils الضمير se.|With ils the pronoun is se."],
 ["Nous ___ réveillons.",["vous","nous","se"],1,"مع nous الضمير nous.|With nous the pronoun is nous."],
 ["Elle ___ lave les mains.",["se","me","te"],0,"مع elle الضمير se.|With elle the pronoun is se."],
 ["Vous ___ levez à quelle heure ?",["vous","nous","te"],0,"مع vous الضمير vous.|With vous the pronoun is vous."],
 ["Je ___ appelle Karim.",["m'","me","s'"],0,"je m'appelle.|Je m'appelle."],
 ["Les enfants ___ réveillent tôt.",["se","nous","vous"],0,"مع les enfants (ils) الضمير se.|With les enfants (ils) the pronoun is se."]]},
{id:"a2-part",ar:"أدوات التبعيض",en:"Partitive articles",fr:"Les articles partitifs",
 intro:"نستعمل du / de la / des للتعبير عن «كمية غير محددة» من شيء لا يُعد (ماء، خبز، سكر).|Du / de la / des express an unspecified quantity of something uncountable (water, bread, sugar).",
 table:{h:["مذكر|Masc.","مؤنث|Fem.","حرف متحرك|Vowel","جمع|Plural"],r:[["du","de la","de l'","des"]]},
 rules:["du pain (بعض الخبز)، de la soupe (بعض الشوربة)، de l'eau (بعض الماء).|Du pain (some bread), de la soupe (some soup), de l'eau (some water).","بعد النفي تصبح كلها de: Je ne mange pas de pain.|After a negation they all become de: Je ne mange pas de pain.","مع aimer / adorer نستعمل le / la / les: J'aime le café.|With aimer / adorer use le / la / les: J'aime le café."],
 ex:[["Je bois du thé.","أشرب شاياً.|I drink tea."],["Elle mange de la viande.","تأكل لحماً.|She eats meat."],["Je ne bois pas de lait.","لا أشرب الحليب.|I don't drink milk."]],
 quiz:[["Je mange ___ pain.",["du","de la","des"],0,"pain مذكر: du pain.|Pain is masculine: du pain."],
 ["Elle boit ___ eau.",["du","de l'","de la"],1,"eau يبدأ بحرف متحرك: de l'eau.|Eau starts with a vowel: de l'eau."],
 ["Je ne mange pas ___ viande.",["de la","de","du"],1,"بعد النفي: de.|After a negation: de."],
 ["J'aime ___ chocolat.",["du","le","de"],1,"مع aimer نستعمل أداة التعريف.|With aimer use the definite article."],
 ["Elle prend ___ café.",["du","de la","des"],0,"café مذكر: du café.|Café is masculine: du café."],
 ["Nous mangeons ___ fruits.",["des","du","de la"],0,"fruits جمع: des fruits.|Fruits is plural: des fruits."],
 ["Tu veux ___ salade ?",["de la","du","de l'"],0,"salade مؤنث: de la salade.|Salade is feminine: de la salade."],
 ["Il n'y a plus ___ sucre.",["de","du","de la"],0,"بعد النفي: de.|After a negation: de."]]},
{id:"a2-comp",ar:"المقارنة",en:"Comparatives",fr:"Le comparatif",
 intro:"للمقارنة بين شيئين: plus (أكثر) و moins (أقل) و aussi (بنفس القدر) ثم que (من).|To compare two things: plus (more), moins (less), aussi (as) followed by que (than / as).",
 table:{h:["المعنى|Meaning","الصيغة|Form"],r:[["أكثر من|more than","plus + صفة|adj. + que"],["أقل من|less than","moins + صفة|adj. + que"],["بقدر|as … as","aussi + صفة|adj. + que"]]},
 rules:["Paul est plus grand que Marc.|Paul is taller than Marc.","استثناء مهم: bon ← meilleur، وbien ← mieux.|Key exceptions: bon ← meilleur, bien ← mieux.","ومع الأفعال: Il travaille plus que moi.|With verbs: Il travaille plus que moi."],
 ex:[["Ma sœur est plus jeune que moi.","أختي أصغر مني.|My sister is younger than me."],["Ce livre est moins cher que celui-là.","هذا الكتاب أرخص من ذاك.|This book is cheaper than that one."],["Il est aussi fort que son père.","هو قوي مثل أبيه.|He is as strong as his father."]],
 quiz:[["Il est ___ grand que moi. (أطول)",["plus","moins","aussi"],0,"أطول = plus grand.|Taller = plus grand."],
 ["Cette glace est ___ que l'autre. (أفضل)",["plus bonne","meilleure","bonne plus"],1,"bon ← meilleur / meilleure.|Bon ← meilleur / meilleure."],
 ["Elle est ___ fatiguée que lui. (أقل)",["moins","plus","aussi"],0,"أقل = moins.|Less = moins."],
 ["Il est aussi fort ___ son frère.",["que","de","comme"],0,"بعد aussi نستعمل que.|After aussi use que."],
 ["Ce film est ___ intéressant que l'autre. (أكثر)",["plus","moins","mieux"],0,"أكثر = plus.|More = plus."],
 ["Je cours ___ vite que lui. (بنفس السرعة)",["aussi","plus","moins"],0,"aussi … que = بقدر.|Aussi … que = as … as."],
 ["Il parle ___ que moi. (أفضل)",["mieux","meilleur","plus bien"],0,"bien (ظرف) ← mieux.|Bien (adverb) ← mieux."],
 ["Ma maison est ___ ta maison.",["plus grande que","plus grand de","plus grande de"],0,"plus + صفة + que.|Plus + adjective + que."]]},
{id:"a2-neg",ar:"نفي متقدم",en:"More negations",fr:"Ne … jamais, plus, rien, personne",
 intro:"إلى جانب ne … pas هناك صيغ نفي أخرى تغيّر المعنى.|Besides ne … pas there are other negations that change the meaning.",
 table:{h:["الصيغة|Form","المعنى|Meaning","مثال|Example"],r:[["ne … jamais","أبداً|never","Je ne mange jamais de viande."],["ne … plus","لم يعد|no longer","Il ne travaille plus."],["ne … rien","لا شيء|nothing","Je ne vois rien."],["ne … personne","لا أحد|nobody","Je ne connais personne."],["ne … pas encore","ليس بعد|not yet","Elle n'est pas encore arrivée."]]},
 rules:["في الماضي المركب: Je n'ai rien mangé.|In the passé composé: Je n'ai rien mangé.","personne و rien يمكن أن يكونا فاعلاً: Personne ne vient. Rien ne change.|Personne and rien can be the subject: Personne ne vient.","بعد ne … jamais / plus تأتي de: Je ne bois plus de café.|After ne … jamais / plus use de: Je ne bois plus de café."],
 ex:[["Je ne bois jamais de café.","لا أشرب القهوة أبداً.|I never drink coffee."],["Il n'y a plus de pain.","لم يعد هناك خبز.|There is no more bread."],["Personne ne parle.","لا أحد يتكلم.|Nobody is speaking."]],
 quiz:[["Il ne mange ___ de viande. (أبداً)",["jamais","rien","personne"],0,"jamais = أبداً.|Jamais = never."],
 ["Je ne vois ___. (لا شيء)",["rien","personne","plus"],0,"rien = لا شيء.|Rien = nothing."],
 ["Elle ne travaille ___. (لم تعد)",["plus","jamais","rien"],0,"plus = لم يعد.|Plus = no longer."],
 ["Je ne connais ___ ici. (لا أحد)",["personne","rien","jamais"],0,"personne = لا أحد.|Personne = nobody."],
 ["Il n'est ___ arrivé. (ليس بعد)",["pas encore","jamais","plus rien"],0,"pas encore = ليس بعد.|Pas encore = not yet."],
 ["Je n'ai ___ mangé. (لا شيء)",["rien","personne","jamais pas"],0,"rien بعد avoir.|Rien after avoir."],
 ["___ ne vient. (لا أحد)",["Personne","Rien","Jamais"],0,"personne فاعل: Personne ne vient.|Personne as subject: Personne ne vient."],
 ["Nous ne sommes ___ allés au Canada. (أبداً)",["jamais","rien","personne"],0,"jamais = أبداً.|Jamais = never."]]},
{id:"a2-coi",ar:"ضمائر المفعول غير المباشر",en:"Indirect object pronouns",fr:"Les pronoms COI",
 intro:"تحلّ محل «à + شخص» وتوضع قبل الفعل.|They replace «à + person» and go before the verb.",

 rules:["lui للمفرد و leur للجمع: Je parle à Marie ← Je lui parle.|Lui for singular, leur for plural: Je parle à Marie ← Je lui parle.","مع أفعال: parler à, donner à, écrire à, téléphoner à, répondre à, dire à.|With verbs: parler à, donner à, écrire à, téléphoner à, répondre à, dire à.","في الماضي المركب قبل avoir: Je lui ai téléphoné.|In the passé composé before avoir: Je lui ai téléphoné."],
 ex:[["Je lui parle.","أكلّمه.|I talk to him / her."],["Elle leur écrit.","تكتب لهم.|She writes to them."],["Il me donne un livre.","يعطيني كتاباً.|He gives me a book."]],
 quiz:[["Je parle à Paul ← Je ___ parle.",["lui","leur","le"],0,"مفرد: lui.|Singular: lui."],
 ["Elle écrit à ses parents ← Elle ___ écrit.",["leur","lui","les"],0,"جمع: leur.|Plural: leur."],
 ["Tu téléphones à ta sœur ← Tu ___ téléphones.",["lui","la","leur"],0,"téléphoner à ← lui.|Téléphoner à ← lui."],
 ["Il donne un cadeau à Marie ← Il ___ donne un cadeau.",["lui","la","leur"],0,"donner à ← lui.|Donner à ← lui."],
 ["Nous répondons aux élèves ← Nous ___ répondons.",["leur","lui","les"],0,"جمع: leur.|Plural: leur."],
 ["Il ___ a dit la vérité. (لي)",["m'","me","moi"],0,"me ← m' قبل a.|Me ← m' before a."],
 ["Elle ___ a téléphoné. (لنا)",["nous","nos","lui"],0,"nous = لنا.|Nous = to us."],
 ["Je ne ___ parle pas. (له)",["lui","le","leur"],0,"lui قبل الفعل.|Lui before the verb."]]},
{id:"a2-yen",ar:"ضميرا المكان والكمية",en:"The pronouns y and en",fr:"Les pronoms y et en",
 intro:"ضميران يغنيان عن تكرار المكان أو الكمية.|Two pronouns that avoid repeating a place or a quantity.",
 rules:["y يعوّض مكاناً بعد à / dans / chez: Tu vas à Paris ? Oui, j'y vais.|Y replaces a place after à / dans / chez: Oui, j'y vais.","en يعوّض de + اسم أو كمية: Tu as des frères ? J'en ai deux.|En replaces de + noun or a quantity: J'en ai deux.","نبقي الرقم أو الكمية: J'en ai trois. Il en mange beaucoup.|Keep the number or quantity: J'en ai trois.","يوضعان قبل الفعل مباشرة.|Both go right before the verb."],
 ex:[["Tu vas au cinéma ? Oui, j'y vais.","هل تذهب إلى السينما؟ نعم أذهب إليها.|Are you going to the cinema? Yes, I'm going."],["Tu veux du thé ? Oui, j'en veux.","هل تريد شاياً؟ نعم أريد.|Do you want tea? Yes, I do."],["J'en ai deux.","عندي اثنان منها.|I have two of them."]],
 quiz:[["Tu vas au cinéma ? Oui, j'___ vais.",["y","en","le"],0,"y للمكان.|Y for a place."],
 ["Tu veux du café ? Oui, j'___ veux.",["en","y","le"],0,"en بدل du café.|En replaces du café."],
 ["Tu as des frères ? Oui, j'___ ai deux.",["en","y","les"],0,"en مع الكمية.|En with a quantity."],
 ["Elle habite à Lyon ? Oui, elle ___ habite.",["y","en","la"],0,"y للمكان.|Y for a place."],
 ["Vous mangez de la viande ? Non, nous n'___ mangeons pas.",["en","y","la"],0,"de la viande ← en.|De la viande ← en."],
 ["Il revient de Paris ? Oui, il ___ revient.",["en","y","le"],0,"de + مكان ← en.|De + place ← en."],
 ["Tu vas chez le médecin ? Oui, j'___ vais ce soir.",["y","en","lui"],0,"chez + مكان ← y.|Chez + place ← y."],
 ["Combien de livres as-tu ? J'___ ai cinq.",["en","y","les"],0,"en مع الرقم.|En with a number."]]},
{id:"a2-imp",ar:"الأمر",en:"The imperative",fr:"L'impératif",
 intro:"لإعطاء أمر أو نصيحة. نستعمل صيغ tu و nous و vous فقط، بدون ضمير.|To give an order or advice. Only the tu, nous and vous forms are used, without the pronoun.",
 table:{h:["الضمير|Pronoun","parler","finir","être","avoir"],r:[["tu","parle","finis","sois","aie"],["nous","parlons","finissons","soyons","ayons"],["vous","parlez","finissez","soyez","ayez"]]},
 rules:["مع الأفعال المنتهية بـ -er نحذف s في tu: Tu parles ← Parle !|With -er verbs drop the s in tu: Tu parles ← Parle !","النفي: Ne parle pas ! Ne parlez pas !|Negative: Ne parle pas ! Ne parlez pas !","في الإثبات الضمير بعد الفعل بشرطة: Dis-moi. وفي النفي قبله: Ne me dis pas.|In the affirmative the pronoun follows with a hyphen: Dis-moi. In the negative it comes before: Ne me dis pas."],
 ex:[["Ouvre la porte !","افتح الباب!|Open the door!"],["Soyez à l'heure !","كونوا في الموعد!|Be on time!"],["Ne parlez pas !","لا تتكلموا!|Don't speak!"]],
 quiz:[["(Parler, tu) ___ plus doucement !",["Parle","Parles","Parler"],0,"في -er نحذف s: Parle.|With -er verbs drop the s: Parle."],
 ["(Finir, vous) ___ vos devoirs !",["Finissez","Finissons","Finis"],0,"مع vous: Finissez.|With vous: Finissez."],
 ["(Être, tu) ___ gentil !",["Sois","Es","Être"],0,"être ← sois.|Être ← sois."],
 ["(Faire, vous) ___ attention !",["Faites","Faisez","Fais"],0,"faire ← faites.|Faire ← faites."],
 ["Ne ___ pas en retard ! (être, tu)",["sois","es","soit"],0,"être ← sois.|Être ← sois."],
 ["(Venir, vous) ___ à la maison !",["Venez","Vient","Viens"],0,"مع vous: Venez.|With vous: Venez."],
 ["«Prenons le bus !» signifie:",["لنركب الحافلة!","سأركب الحافلة","اركب الحافلة"],0,"nous في الأمر = لنفعل.|Nous imperative = let's."],
 ["Pour dire à un ami «اكتب لي»:",["Écris-moi","Tu écris moi","Écrire-moi"],0,"أمر + ضمير بشرطة.|Imperative + hyphenated pronoun."]]},
{id:"a2-mod",ar:"أفعال القدرة والرغبة والوجوب",en:"Modal verbs",fr:"Pouvoir, vouloir, devoir",
 intro:"ثلاثة أفعال شائعة جداً، يأتي بعدها فعل في المصدر.|Three very common verbs, followed by an infinitive.",
 table:{h:["الضمير|Pronoun","pouvoir","vouloir","devoir"],r:[["je","peux","veux","dois"],["tu","peux","veux","dois"],["il / elle / on","peut","veut","doit"],["nous","pouvons","voulons","devons"],["vous","pouvez","voulez","devez"],["ils / elles","peuvent","veulent","doivent"]]},
 rules:["pouvoir = يستطيع أو يُسمح، vouloir = يريد، devoir = يجب عليه.|Pouvoir = can / may, vouloir = to want, devoir = must / to have to.","للأدب نستعمل je voudrais بدل je veux.|For politeness use je voudrais instead of je veux.","النفي حول الفعل الأول: Je ne peux pas venir.|Negation goes around the first verb: Je ne peux pas venir."],
 ex:[["Je peux venir demain.","أستطيع المجيء غداً.|I can come tomorrow."],["Nous devons partir.","يجب أن نغادر.|We must leave."],["Je voudrais un café.","أريد قهوة (بأدب).|I would like a coffee."]],
 quiz:[["Je ___ venir demain. (أستطيع)",["peux","peut","peuvent"],0,"مع je: peux.|With je: peux."],
 ["Tu ___ du thé ? (تريد)",["veux","veut","voulez"],0,"مع tu: veux.|With tu: veux."],
 ["Nous ___ travailler. (يجب علينا)",["devons","devez","doivent"],0,"مع nous: devons.|With nous: devons."],
 ["Ils ___ partir. (يريدون)",["veulent","veut","voulons"],0,"مع ils: veulent.|With ils: veulent."],
 ["Elle ___ rester ici. (تستطيع)",["peut","peux","pouvons"],0,"مع elle: peut.|With elle: peut."],
 ["Vous ___ m'aider ? (تستطيعون)",["pouvez","peuvent","peux"],0,"مع vous: pouvez.|With vous: pouvez."],
 ["Je ___ un café, s'il vous plaît.",["voudrais","veux","voulais"],0,"للطلب المهذب: je voudrais.|Polite request: je voudrais."],
 ["On ne ___ pas fumer ici.",["peut","peux","peuvent"],0,"مع on: peut.|With on: peut."]]},
{id:"a2-sup",ar:"صيغة التفضيل",en:"The superlative",fr:"Le superlatif",
 intro:"للتعبير عن الأكثر أو الأقل أو الأفضل بين الجميع.|To say the most, the least or the best of all.",
 table:{h:["المعنى|Meaning","الصيغة|Form"],r:[["الأطول|the tallest","le plus grand"],["الأقل ثمناً|the cheapest","le moins cher"],["الأفضل|the best","le meilleur / la meilleure"]]},
 rules:["le / la / les + plus / moins + صفة: Il est le plus grand de la classe.|Le / la / les + plus / moins + adjective: Il est le plus grand de la classe.","للأفضل: le meilleur / la meilleure / les meilleurs.|For the best: le meilleur / la meilleure / les meilleurs.","بعدها نستعمل de: le plus grand de la classe / du monde.|Afterwards use de: le plus grand de la classe."],
 ex:[["C'est le plus grand de la classe.","هو الأطول في الصف.|He is the tallest in the class."],["C'est la meilleure élève.","هي أفضل طالبة.|She is the best student."],["Ce livre est le moins cher.","هذا الكتاب هو الأرخص.|This book is the cheapest."]],
 quiz:[["Elle est ___ grande de la classe.",["la plus","plus la","le plus"],0,"مؤنث: la plus grande.|Feminine: la plus grande."],
 ["C'est ___ gâteau de la ville. (الأفضل)",["le meilleur","le plus bon","meilleur le"],0,"le meilleur.|Le meilleur."],
 ["Ce livre est ___ cher. (الأقل)",["le moins","le plus petit","moins le"],0,"le moins + صفة.|Le moins + adjective."],
 ["Paul est ___ rapide de tous.",["le plus","plus le","la plus"],0,"مذكر: le plus.|Masculine: le plus."],
 ["Ce sont ___ élèves de l'école. (الأفضل)",["les meilleurs","les plus bons","le meilleur"],0,"جمع: les meilleurs.|Plural: les meilleurs."],
 ["Mon frère est ___ jeune de la famille.",["le plus","la plus","plus"],0,"مذكر: le plus jeune.|Masculine: le plus jeune."],
 ["Elle est ___ intelligente de tous.",["la plus","le plus","plus la"],0,"مؤنث: la plus intelligente.|Feminine: la plus intelligente."],
 ["بعد الصيغة نستعمل غالباً:|After the superlative we usually use:",["de","que","à"],0,"le plus grand de la classe.|Le plus grand de la classe."]]}
],
B1:[
{id:"b1-imp",ar:"الماضي الناقص",en:"The imperfect",fr:"L'imparfait",
 intro:"نستعمله لوصف الماضي والعادات والحالة المستمرة (كان يفعل). نأخذ صيغة nous في الحاضر، نحذف -ons، ونضيف النهايات.|Used to describe the past, habits and ongoing states (used to / was doing). Take the nous form of the present, remove -ons and add the endings.",
 table:{h:["الضمير|Pronoun","النهاية|Ending","parler"],r:[["je","-ais","parlais"],["tu","-ais","parlais"],["il / elle / on","-ait","parlait"],["nous","-ions","parlions"],["vous","-iez","parliez"],["ils / elles","-aient","parlaient"]]},
 rules:["الاستثناء الوحيد: être ← ét- (j'étais, nous étions).|The only exception: être ← ét- (j'étais, nous étions).","للوصف والعادة: Quand j'étais petit, je jouais au foot.|For description and habit: Quand j'étais petit, je jouais au foot.","الماضي المركب للحدث المحدد، والناقص للخلفية: Il pleuvait quand je suis sorti.|Passé composé for a specific event, imperfect for the background: Il pleuvait quand je suis sorti."],
 ex:[["Quand j'étais enfant, j'habitais à Alger.","عندما كنت طفلاً كنت أسكن في الجزائر.|When I was a child I lived in Algiers."],["Nous mangions toujours ensemble.","كنا نأكل دائماً معاً.|We always used to eat together."],["Il faisait beau.","كان الطقس جميلاً.|The weather was nice."]],
 quiz:[["Quand j'étais petit, je ___ au football.",["jouais","joue","ai joué"],0,"عادة في الماضي: je jouais.|Past habit: je jouais."],
 ["Nous ___ à la plage chaque été.",["allions","allons","sommes allés"],0,"عادة متكررة: nous allions.|Repeated habit: nous allions."],
 ["L'imparfait de «être» avec «il»:",["était","étais","étaient"],0,"il était.|Il était."],
 ["Il ___ quand je suis sorti. (كانت تمطر)",["pleuvait","a plu","pleut"],0,"الخلفية المستمرة ← imparfait.|Ongoing background ← imperfect."],
 ["Quand elle était jeune, elle ___ beaucoup.",["lisait","lit","a lu"],0,"عادة ماضية: elle lisait.|Past habit: elle lisait."],
 ["Nous ___ voisins à l'époque. (être)",["étions","sommes","serons"],0,"nous étions.|Nous étions."],
 ["Ils ___ toujours en retard. (être)",["étaient","étaient en","ont été"],0,"عادة: ils étaient.|Habit: ils étaient."],
 ["Tu ___ où quand j'ai téléphoné ? (être)",["étais","es","seras"],0,"حالة وقتها: tu étais.|State at that moment: tu étais."]]},
{id:"b1-fs",ar:"المستقبل البسيط",en:"The simple future",fr:"Le futur simple",
 intro:"للتعبير عن المستقبل الأبعد أو الرسمي. نأخذ المصدر (infinitif) ونضيف: -ai, -as, -a, -ons, -ez, -ont.|For the more distant or formal future. Take the infinitive and add: -ai, -as, -a, -ons, -ez, -ont.",
 table:{h:["الضمير|Pronoun","parler","finir"],r:[["je","parlerai","finirai"],["tu","parleras","finiras"],["il / elle / on","parlera","finira"],["nous","parlerons","finirons"],["vous","parlerez","finirez"],["ils / elles","parleront","finiront"]]},
 rules:["الأفعال المنتهية بـ -re نحذف e: prendre ← je prendrai.|For -re verbs drop the e: prendre ← je prendrai.","أفعال شاذة لها جذر خاص: être ← ser-، avoir ← aur-، aller ← ir-، faire ← fer-، venir ← viendr-، pouvoir ← pourr-.|Irregular stems: être ← ser-, avoir ← aur-, aller ← ir-, faire ← fer-, venir ← viendr-, pouvoir ← pourr-."],
 ex:[["Demain, il fera beau.","غداً سيكون الجو جميلاً.|Tomorrow the weather will be nice."],["Je serai là à huit heures.","سأكون هناك في الثامنة.|I will be there at eight."],["Nous partirons en juillet.","سنسافر في يوليو.|We will leave in July."]],
 quiz:[["Demain, je ___ à Paris.",["serai","suis","étais"],0,"مستقبل: je serai.|Future: je serai."],
 ["Elle ___ une lettre. (ستكتب)",["écrira","écrit","écrivait"],0,"écrire ← écrir- ثم -a.|Écrire ← écrir- then -a."],
 ["Nous ___ en vacances. (سنذهب)",["irons","allons","allions"],0,"aller جذره ir-: nous irons.|Aller stem ir-: nous irons."],
 ["Ils ___ demain.",["viendront","venaient","viennent"],0,"venir ← viendr-.|Venir ← viendr-."],
 ["Tu ___ tes amis la semaine prochaine. (voir)",["verras","vois","voyais"],0,"voir ← verr-: tu verras.|Voir ← verr-: tu verras."],
 ["Il ___ beau demain. (faire)",["fera","fait","faisait"],0,"faire ← fer-: il fera.|Faire ← fer-: il fera."],
 ["Je ___ du temps. (avoir)",["aurai","ai","avais"],0,"avoir ← aur-: j'aurai.|Avoir ← aur-: j'aurai."],
 ["Vous ___ prendre le train ? (pouvoir)",["pourrez","pouvez","pouviez"],0,"pouvoir ← pourr-: vous pourrez.|Pouvoir ← pourr-: vous pourrez."]]},
{id:"b1-cod",ar:"ضمائر المفعول المباشر",en:"Direct object pronouns",fr:"Les pronoms COD",
 intro:"نستعمل الضمير بدل الاسم الذي وقع عليه الفعل مباشرة لتجنب التكرار. يوضع قبل الفعل.|Use a pronoun instead of the noun that receives the action directly, to avoid repetition. It goes before the verb.",
 table:{h:["الضمير|Pronoun","المعنى|Meaning"],r:[["le (l')","هو (مذكر)|him / it (m.)"],["la (l')","هي (مؤنث)|her / it (f.)"],["les","هم / هنّ|them"],["me / te","أنا / أنتَ|me / you"],["nous / vous","نحن / أنتم|us / you"]]},
 rules:["Je regarde le film ← Je le regarde.|Je regarde le film ← Je le regarde.","النفي: Je ne le regarde pas.|Negative: Je ne le regarde pas.","في الماضي المركب يوضع قبل avoir ويتفق اسم المفعول: J'ai vu la fille ← Je l'ai vue.|In the passé composé it goes before avoir and the participle agrees: J'ai vu la fille ← Je l'ai vue."],
 ex:[["Tu connais Paul ? Oui, je le connais.","هل تعرف بول؟ نعم أعرفه.|Do you know Paul? Yes, I know him."],["Elle mange la pomme ? Oui, elle la mange.","هل تأكل التفاحة؟ نعم تأكلها.|Is she eating the apple? Yes, she is eating it."],["Je les achète.","أشتريها / أشتريهم.|I buy them."]],
 quiz:[["Tu vois Marie ? Oui, je ___ vois.",["le","la","les"],1,"Marie مؤنث ← la.|Marie is feminine ← la."],
 ["Il prend les livres ← Il ___ prend.",["le","la","les"],2,"livres جمع ← les.|Livres is plural ← les."],
 ["Je ne ___ connais pas. (أعرفه)",["le","la","lui"],0,"مذكر مفرد مفعول مباشر ← le.|Masculine singular direct object ← le."],
 ["Tu as acheté la robe ? Oui, je ___ ai achetée.",["l'","le","les"],0,"la تصبح l' أمام avoir.|La becomes l' before avoir."],
 ["Il regarde le match ← Il ___ regarde.",["le","la","les"],0,"match مذكر ← le.|Match is masculine ← le."],
 ["Elle mange les fruits ← Elle ___ mange.",["les","le","lui"],0,"جمع ← les.|Plural ← les."],
 ["Je ___ aime beaucoup. (أحبه، le film)",["l'","lui","y"],0,"le ← l' قبل حرف متحرك.|Le ← l' before a vowel."],
 ["Où est ta clé ? Je ne ___ trouve pas.",["la","le","les"],0,"clé مؤنث ← la.|Clé is feminine ← la."]]},
{id:"b1-cond",ar:"الشرطي (التمني والأدب)",en:"The conditional",fr:"Le conditionnel présent",
 intro:"نستعمله للطلب المهذب والتمنّي والنصيحة. جذر المستقبل + نهايات الماضي الناقص.|Used for polite requests, wishes and advice. Future stem + imperfect endings.",
 table:{h:["الضمير|Pronoun","vouloir"],r:[["je","voudrais"],["tu","voudrais"],["il / elle / on","voudrait"],["nous","voudrions"],["vous","voudriez"],["ils / elles","voudraient"]]},
 rules:["الطلب المهذب: Je voudrais un café. Pourriez-vous m'aider ?|Polite request: Je voudrais un café. Pourriez-vous m'aider ?","النصيحة: Tu devrais dormir plus.|Advice: Tu devrais dormir plus.","التمنّي: J'aimerais voyager.|Wish: J'aimerais voyager.","جملة الشرط: Si j'avais de l'argent, j'achèterais une voiture.|Condition: Si j'avais de l'argent, j'achèterais une voiture."],
 ex:[["Je voudrais un renseignement.","أريد معلومة (بأدب).|I would like some information."],["Tu devrais te reposer.","ينبغي أن ترتاح.|You should rest."],["Si j'étais riche, je voyagerais.","لو كنت غنياً لسافرت.|If I were rich, I would travel."]],
 quiz:[["Pour demander poliment: «___ un café.»",["Je veux","Je voudrais","Je voulais"],1,"الطلب المهذب: je voudrais.|Polite request: je voudrais."],
 ["Si j'avais le temps, je ___.",["voyagerais","voyagerai","voyage"],0,"بعد si + imparfait نستعمل الشرطي.|After si + imperfect use the conditional."],
 ["Tu ___ dormir un peu. (نصيحة)",["devrais","dois","devais"],0,"النصيحة بالشرطي.|Advice uses the conditional."],
 ["Nous ___ venir. (نودّ)",["aimerions","aimons","aimerons"],0,"nous aimerions.|Nous aimerions."],
 ["Si tu étudiais, tu ___ ton examen.",["réussirais","réussiras","réussis"],0,"si + imparfait ← شرطي.|Si + imperfect ← conditional."],
 ["Vous ___ m'aider ? (بأدب)",["pourriez","pouvez","pourrez"],0,"pourriez للأدب.|Pourriez for politeness."],
 ["Il ___ venir, mais il est malade.",["voudrait","voudra","voulait"],0,"التمنّي ← شرطي.|Wish ← conditional."],
 ["Si j'étais toi, je ___ cet emploi.",["prendrais","prendrai","prends"],0,"prendre ← prendr- + -ais.|Prendre ← prendr- + -ais."]]},
{id:"b1-rel",ar:"الضمائر الموصولة الأساسية",en:"Relative pronouns qui and que",fr:"Les pronoms relatifs qui et que",
 intro:"تربط جملتين: qui تحلّ محل الفاعل، و que تحلّ محل المفعول.|They join two sentences: qui replaces the subject, que replaces the object.",
 rules:["qui = الفاعل، وبعدها فعل: L'homme qui parle est mon père.|Qui = subject, followed by a verb: L'homme qui parle est mon père.","que = المفعول، وبعدها فاعل: Le livre que je lis est intéressant.|Que = object, followed by a subject: Le livre que je lis est intéressant.","que تصبح qu' أمام حرف متحرك: Le film qu'il regarde.|Que becomes qu' before a vowel: Le film qu'il regarde.","لا تتغير qui أبداً.|Qui never changes."],
 ex:[["La fille qui chante est ma cousine.","البنت التي تغني هي ابنة عمي.|The girl who is singing is my cousin."],["Le café que tu bois est chaud.","القهوة التي تشربها ساخنة.|The coffee you are drinking is hot."],["Voici le gâteau qu'elle a préparé.","هذه الكعكة التي حضّرتها.|Here is the cake she made."]],
 quiz:[["L'homme ___ travaille ici est médecin.",["qui","que","où"],0,"بعد الفراغ فعل فالفراغ فاعل ← qui.|A verb follows, so the blank is the subject ← qui."],
 ["Le livre ___ je lis est long.",["qui","que","dont"],1,"بعد الفراغ فاعل (je) ← que.|A subject follows (je) ← que."],
 ["La voiture ___ il a achetée est rouge.",["qui","qu'","que"],2,"بعد الفراغ فاعل (il) ← que.|A subject follows (il) ← que."],
 ["J'ai un ami ___ habite à Paris.",["qui","que","quoi"],0,"بعد الفراغ فعل (habite) ← qui.|A verb follows (habite) ← qui."],
 ["Le film ___ nous avons vu était drôle.",["que","qui","dont"],0,"بعد الفراغ فاعل (nous) ← que.|A subject follows (nous) ← que."],
 ["Les élèves ___ étudient réussissent.",["qui","que","où"],0,"فعل بعدها ← qui.|Verb follows ← qui."],
 ["La chanson ___ elle écoute est triste.",["qu'","qui","quoi"],0,"que ← qu' قبل elle.|Que ← qu' before elle."],
 ["Le professeur ___ j'admire est très gentil.",["que","qui","quoi"],0,"بعد الفراغ فاعل j' ← que.|A subject follows (j') ← que."]]},
{id:"b1-pqp",ar:"الماضي البعيد",en:"The pluperfect",fr:"Le plus-que-parfait",
 intro:"نستعمله لحدث وقع قبل حدث آخر في الماضي: avoir أو être في الماضي الناقص + اسم المفعول.|Used for an event that happened before another past event: avoir or être in the imperfect + the past participle.",
 table:{h:["الضمير|Pronoun","avoir","être"],r:[["je","avais mangé","étais allé(e)"],["tu","avais mangé","étais allé(e)"],["il / elle","avait mangé","était allé(e)"],["nous","avions mangé","étions allé(e)s"],["vous","aviez mangé","étiez allé(e)(s)"],["ils / elles","avaient mangé","étaient allé(e)s"]]},
 rules:["اختيار avoir أو être كما في الماضي المركب.|The choice of avoir or être is the same as in the passé composé.","Quand je suis arrivé, il était déjà parti.|Quand je suis arrivé, il était déjà parti.","في الشرط للماضي: Si j'avais su, je serais venu.|Past condition: Si j'avais su, je serais venu."],
 ex:[["Il avait déjà mangé.","كان قد أكل بالفعل.|He had already eaten."],["Elles étaient parties avant nous.","كنّ قد غادرن قبلنا.|They had left before us."],["Nous n'avions pas compris.","لم نكن قد فهمنا.|We had not understood."]],
 quiz:[["Quand je suis arrivé, elle ___ déjà partie.",["était","est","avait"],0,"partir مع être: elle était partie.|Partir uses être: elle était partie."],
 ["J'___ fini quand il a téléphoné.",["avais","ai","aurais"],0,"plus-que-parfait: j'avais fini.|Pluperfect: j'avais fini."],
 ["Nous ___ déjà mangé.",["avions","étions","avons"],0,"nous avions mangé.|Nous avions mangé."],
 ["Ils ___ arrivés avant nous.",["étaient","avaient","sont"],0,"arriver مع être: ils étaient arrivés.|Arriver uses être: ils étaient arrivés."],
 ["Il a dit qu'il ___ oublié. (كان قد نسي)",["avait","a","aura"],0,"il avait oublié.|Il avait oublié."],
 ["Tu ___ déjà vu ce film ?",["avais","avait","étais"],0,"tu avais vu.|Tu avais vu."],
 ["Le plus-que-parfait exprime:|The pluperfect expresses:",["حدثاً سابقاً لحدث ماضٍ آخر|an event before another past event","حدثاً مستقبلياً|a future event","عادة في الحاضر|a present habit"],0,"سابق لحدث ماضٍ.|Before another past event."],
 ["Elle n'___ pas compris.",["avait","était","a"],0,"elle n'avait pas compris.|Elle n'avait pas compris."]]},
{id:"b1-subj",ar:"المضارع الإلزامي",en:"The subjunctive",fr:"Le subjonctif présent",
 intro:"نستعمله بعد التعبيرات التي تعبّر عن الضرورة والرغبة والعاطفة والشك: il faut que، vouloir que، bien que... نأخذ ils في الحاضر، نحذف -ent، ونضيف النهايات.|Used after expressions of necessity, wish, emotion and doubt: il faut que, vouloir que, bien que... Take the ils present form, remove -ent and add the endings.",
 table:{h:["الضمير|Pronoun","النهاية|Ending","parler"],r:[["que je","-e","parle"],["que tu","-es","parles"],["qu'il / elle","-e","parle"],["que nous","-ions","parlions"],["que vous","-iez","parliez"],["qu'ils / elles","-ent","parlent"]]},
 rules:["أفعال شاذة: être ← sois, avoir ← aie, aller ← aille, faire ← fasse, pouvoir ← puisse.|Irregulars: être ← sois, avoir ← aie, aller ← aille, faire ← fasse, pouvoir ← puisse.","بعد: il faut que, vouloir que, avant que, bien que, pour que.|After: il faut que, vouloir que, avant que, bien que, pour que.","إذا كان الفاعل واحداً نستعمل المصدر: Je veux partir. لكن: Je veux que tu partes.|With the same subject use the infinitive: Je veux partir. But: Je veux que tu partes.","لا نستعمله بعد croire / penser في الإثبات.|Not used after croire / penser in the affirmative."],
 ex:[["Il faut que tu fasses tes devoirs.","يجب أن تؤدي واجباتك.|You must do your homework."],["Je veux que vous soyez à l'heure.","أريدكم أن تكونوا في الموعد.|I want you to be on time."],["Bien qu'il soit fatigué, il travaille.","رغم أنه متعب فهو يعمل.|Although he is tired, he works."]],
 quiz:[["Il faut que tu ___ tes devoirs.",["fasses","fais","faire"],0,"faire ← fasse.|Faire ← fasse."],
 ["Je veux que vous ___ à l'heure.",["soyez","êtes","serez"],0,"être ← soyez.|Être ← soyez."],
 ["Bien qu'il ___ fatigué, il travaille.",["soit","est","sera"],0,"بعد bien que: soit.|After bien que: soit."],
 ["Il faut que j'___ plus de temps.",["aie","ai","aurai"],0,"avoir ← aie.|Avoir ← aie."],
 ["Je veux ___ au cinéma. (فاعل واحد)",["aller","que j'aille","allé"],0,"فاعل واحد ← مصدر.|Same subject ← infinitive."],
 ["Il faut qu'elle ___ chez le médecin.",["aille","va","allait"],0,"aller ← aille.|Aller ← aille."],
 ["Avant qu'il ___, appelle-moi. (partir)",["parte","part","partira"],0,"بعد avant que: parte.|After avant que: parte."],
 ["Après «croire que» au positif on utilise:|After «croire que» (affirmative) we use:",["l'indicatif","le subjonctif","le conditionnel"],0,"المؤكد ← indicatif.|Affirmative ← indicative."]]},
{id:"b1-pass",ar:"المبني للمجهول",en:"The passive voice",fr:"La voix passive",
 intro:"نجعل المفعول به فاعلاً: être (بزمن الجملة) + اسم المفعول + par. يتفق اسم المفعول مع الفاعل الجديد.|The object becomes the subject: être (in the sentence tense) + past participle + par. The participle agrees with the new subject.",
 rules:["Le professeur corrige les exercices ← Les exercices sont corrigés par le professeur.|Le professeur corrige les exercices ← Les exercices sont corrigés par le professeur.","الزمن في être هو زمن الجملة: ont été corrigés (ماضي)، seront corrigés (مستقبل).|The tense is carried by être: ont été corrigés (past), seront corrigés (future).","في الكلام اليومي نفضّل on أو الصيغة الفاعلة.|In everyday speech we prefer on or the active voice.","par للفاعل، و de مع بعض الأفعال: Il est aimé de tous.|Par for the agent, de with some verbs: Il est aimé de tous."],
 ex:[["Le gâteau est préparé par ma mère.","الكعكة تُحضَّر من أمي.|The cake is prepared by my mother."],["Ce livre a été écrit en 1990.","كُتب هذا الكتاب سنة 1990.|This book was written in 1990."],["Le pont sera construit l'année prochaine.","سيُبنى الجسر العام القادم.|The bridge will be built next year."]],
 quiz:[["Le gâteau ___ par ma mère.",["est préparé","prépare","a préparé"],0,"être + participe.|Être + participle."],
 ["Les lettres ___ écrites par Paul.",["sont","ont","est"],0,"être مع الجمع: sont.|Être with plural: sont."],
 ["Ce livre a été ___ en 1990.",["écrit","écrivé","écrire"],0,"écrire ← écrit.|Écrire ← écrit."],
 ["La porte ___ fermée.",["est","a","sont"],0,"être مع مفرد: est.|Être with singular: est."],
 ["Le voleur ___ arrêté par la police. (ماضي)",["a été","sera","sont"],0,"ماضٍ مركب: a été arrêté.|Passé composé: a été arrêté."],
 ["Les élèves ___ punis par le directeur.",["ont été","a été","as été"],0,"جمع: ont été.|Plural: ont été."],
 ["La forme passive utilise le verbe:|The passive uses the verb:",["être","avoir","aller"],0,"être + participe.|Être + participle."],
 ["Le pont sera ___ l'année prochaine.",["construit","construite","construire"],0,"pont مذكر: construit.|Pont is masculine: construit."]]},
{id:"b1-ger",ar:"الجيرون (المصدر الحالي)",en:"The gerund",fr:"Le gérondif",
 intro:"en + الفعل بنهاية -ant، ويعبّر عن حدثين متزامنين أو عن الطريقة. نأخذ nous في الحاضر، نحذف -ons ونضيف -ant.|En + the -ant form, used for two simultaneous actions or for the manner. Take the nous present form, remove -ons and add -ant.",

/* ---------- القواعد ---------- */
const GRS = { view:'menu', level:'A1', lang:'both', id:null, ans:[], ord:[], done:{} };
(function(){
  try{ const p = JSON.parse(localStorage.getItem('fo_gr_pref')||'{}'); if(['A1','A2','B1'].includes(p.level)) GRS.level = p.level; if(['ar','en','both'].includes(p.lang)) GRS.lang = p.lang; }catch(e){}
  try{ GRS.done = JSON.parse(localStorage.getItem('fo_gr_done')||'{}') || {}; }catch(e){}
})();
function grSave(){ try{ localStorage.setItem('fo_gr_pref', JSON.stringify({ level:GRS.level, lang:GRS.lang })); localStorage.setItem('fo_gr_done', JSON.stringify(GRS.done)); }catch(e){} }
const grLessons = () => GR[GRS.level] || [];
const grLesson = id => grLessons().find(l => l.id === id);
/* نص بلغتين: 'عربي|English' */
function grT(s){ const p = String(s).split('|'); return { ar:p[0], en:(p[1] !== undefined ? p[1] : p[0]), two:p.length > 1 }; }
/* نص عربي: تُعزل الكلمات الفرنسية داخل الجملة حتى لا يختلط الترتيب */
function grAr(str){
  const re = /[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9'’\-.,!?…()\/+←→ ]*[A-Za-zÀ-ÿ0-9'’!?…)]|[A-Za-zÀ-ÿ]/g; let out = '', last = 0, m;
  while((m = re.exec(str))){ out += esc(str.slice(last, m.index)) + '<bdi dir="ltr" lang="fr" class="grlat">' + esc(m[0]) + '</bdi>'; last = m.index + m[0].length; }
  return out + esc(str.slice(last));
}
function grBi(s, cls){
  const t = grT(s); if(!t.two) return `<span class="${cls||''}" dir="auto">${esc(t.ar)}</span>`;
  const ar = `<span class="gar" dir="rtl">${grAr(t.ar)}</span>`, en = `<span class="gen" dir="ltr">${esc(t.en)}</span>`;
  return GRS.lang === 'ar' ? ar : GRS.lang === 'en' ? en : ar + en;
}
function grInline(s){
  const t = grT(s); if(!t.two) return esc(t.ar);
  return GRS.lang === 'ar' ? grAr(t.ar) : GRS.lang === 'en' ? esc(t.en) : grAr(t.ar) + ' <span class="gsep">·</span> ' + esc(t.en);
}
const grShuffle = n => { const a = [...Array(n).keys()]; for(let i = n - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function grNewOrder(l){ GRS.ord = l.quiz.map(q => grShuffle(q[1].length)); }
const grDone = id => GRS.done[id];
function grLangBar(){
  return `<div class="vpills">${[['ar','عربي'],['en','English'],['both','الاثنان']].map(([k, l]) => `<button class="vpill sm ${GRS.lang === k ? 'on' : ''}" data-a="grLang" data-id="${k}">${l}</button>`).join('')}</div>`;
}
const grVerdict = ok => { const ar = ok ? '✓ صحيح' : '✗ غير صحيح', en = ok ? '✓ Correct' : '✗ Incorrect'; return GRS.lang === 'ar' ? ar : GRS.lang === 'en' ? en : ar + ' · ' + en; };
function grQuizHtml(l){
  const answered = GRS.ans.filter(a => a !== null && a !== undefined).length;
  const right = l.quiz.reduce((n, q, i) => n + (GRS.ans[i] === q[2] ? 1 : 0), 0);
  let h = l.quiz.map((q, qi) => {
    const a = GRS.ans[qi], has = a !== null && a !== undefined;
    const ord = GRS.ord[qi] || q[1].map((_, i) => i);
    return `<div class="grq"><p class="grqt">${qi + 1}. ${grInline(q[0])}</p><div class="gropts">${ord.map(oi => {
      let c = 'gro'; if(has){ if(oi === q[2]) c += ' right'; else if(oi === a) c += ' wrong'; }
      return `<button class="${c}" data-a="grAns" data-id="${qi}" data-o="${oi}" dir="auto" ${has ? 'disabled' : ''}>${grInline(q[1][oi])}</button>`;
    }).join('')}</div>${has ? `<div class="grwhy ${a === q[2] ? 'ok' : 'bad'}"><b>${grVerdict(a === q[2])}</b>${grBi(q[3])}</div>` : ''}</div>`;
  }).join('');
  if(answered === l.quiz.length) h += `<div class="grres"><b>${right} / ${l.quiz.length}</b><span>${right === l.quiz.length ? 'ممتاز! Excellent!' : right >= l.quiz.length * .6 ? 'جيد Good' : 'راجع الدرس وأعد المحاولة · Review and try again'}</span><button class="btn sec" data-a="grRetry">أعد التمرين · Retry</button></div>`;
  return h;
}
function renderGrammar(v){
  v.dir = '';
  if(GRS.view === 'lesson') return renderGrLesson(v);
  const pills = ['A1','A2','B1'].map(l => `<button class="vpill ${GRS.level === l ? 'on' : ''}" data-a="grLevel" data-id="${l}">${l}</button>`).join('');
  const ls = grLessons(), dn = ls.filter(l => grDone(l.id) !== undefined).length;
  v.innerHTML = `<h2 class="st"><span>${I('gram')} القواعد <small>Grammaire</small></span></h2>
    <div class="vbar2"><div class="vpills">${pills}</div>${grLangBar()}</div>
    <p class="cap" style="margin:8px 2px 14px">أنهيت ${dn} من ${ls.length} درساً في هذا المستوى.</p>
    <div class="vgrid">${ls.map((l, i) => { const d = grDone(l.id); return `<button class="vcat" data-a="grOpen" data-id="${l.id}"><b>${i + 1}. ${GRS.lang === 'en' ? esc(l.en) : esc(l.ar)}</b><span class="vf" dir="ltr">${esc(l.fr)}${GRS.lang === 'both' ? ' · ' + esc(l.en) : ''}</span><span class="vn" dir="ltr">${d !== undefined ? '✓ ' + d + ' / ' + l.quiz.length : 'لم يُحلّ بعد'}</span></button>`; }).join('')}</div>`;
}
function renderGrLesson(v){
  const l = grLesson(GRS.id); if(!l){ GRS.view = 'menu'; return renderGrammar(v); }
  const tb = l.table ? `<div class="grtw"><table class="grt"><thead><tr>${l.table.h.map(x => `<th>${grInline(x)}</th>`).join('')}</tr></thead><tbody>${l.table.r.map(r => `<tr>${r.map((x, i) => `<td ${grT(x).two ? '' : 'lang="fr"'}>${grInline(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '';
  v.innerHTML = `<div class="grl"><div class="vbar2"><button class="btn sec" data-a="grBack">← القواعد · Grammar</button>${grLangBar()}</div>
    <h2 class="grtitle"><span class="grfr" lang="fr">${esc(l.fr)}</span><span class="grsub">${GRS.lang === 'en' ? esc(l.en) : GRS.lang === 'ar' ? esc(l.ar) : esc(l.ar) + ' · ' + esc(l.en)}</span></h2>
    <div class="card grbox"><p class="grp">${grBi(l.intro)}</p>${tb}
      <h4 class="grh">القاعدة · Rules</h4><ul class="grul">${l.rules.map(r => `<li>${grBi(r)}</li>`).join('')}</ul>
      <h4 class="grh">أمثلة · Examples</h4>${l.ex.map((e, i) => `<div class="vrow"><button class="vsp" data-a="grSay" data-id="${i}" aria-label="استمع">${I('play','s')}</button><div class="vtx"><span class="vfr" lang="fr">${esc(e[0])}</span><span class="grtr">${grBi(e[1])}</span></div></div>`).join('')}</div>
    <h3 class="grh2">تمرين · Exercise</h3><div class="card grbox" id="grq">${grQuizHtml(l)}</div></div>`;
}
const GRH = {
  grLevel:(id) => { GRS.level = id; grSave(); render(); },
  grLang:(id) => { GRS.lang = id; grSave(); render(); },
  grOpen:(id) => { const l = grLesson(id); if(!l) return; GRS.id = id; GRS.view = 'lesson'; GRS.ans = []; grNewOrder(l); render(); window.scrollTo(0, 0); },
  grBack:() => { GRS.view = 'menu'; render(); },
  grSay:(id) => { const l = grLesson(GRS.id); if(l && l.ex[+id]) speak(l.ex[+id][0], .85); },
  grAns:(id, el) => {
    const l = grLesson(GRS.id); if(!l) return; const qi = +id;
    if(GRS.ans[qi] !== undefined && GRS.ans[qi] !== null) return;
    GRS.ans[qi] = +el.dataset.o;
    if(l.quiz.every((q, i) => GRS.ans[i] !== undefined && GRS.ans[i] !== null)){
      const right = l.quiz.reduce((n, q, i) => n + (GRS.ans[i] === q[2] ? 1 : 0), 0);
      if(grDone(l.id) === undefined || right > grDone(l.id)) GRS.done[l.id] = right;
      grSave();
    }
    const box = document.getElementById('grq'); if(box) box.innerHTML = grQuizHtml(l);
  },
  grRetry:() => { const l = grLesson(GRS.id), box = document.getElementById('grq'); if(!l || !box) return; GRS.ans = []; grNewOrder(l); box.innerHTML = grQuizHtml(l); box.scrollIntoView({ block:'start' }); }
};

const H = {
  ...GH, ...VH, ...GRH,
  moreMenu:()=>{
    const m = [['videos','video','الفيديوهات'],['assignments','assign','الواجبات'],['links','link','الروابط']];
    if(state.teacher){ m.push(['track','chart','المتابعة']); m.push(['people','users','الصفوف والطلاب']); }
    else if(state.me && state.me.student) m.push(['mine','list','نتائجي']);
    openModal(`<h3>المزيد</h3><div class="moregrid">${m.map(([k,ic,l])=>`<button data-a="moreGo" data-id="${k}">${I(ic)}<span>${l}</span></button>`).join('')}</div>`);
  },
  moreGo:id=>{ closeModal(); state.tab=id; state.level='all'; state.cat='all'; state.cls='all'; state.q=''; render(); window.scrollTo(0,0); },
  tab:id=>{ state.tab=id; state.level='all'; state.cat='all'; state.cls='all'; state.q=''; render(); window.scrollTo(0,0); },
  clsf:id=>{ state.cls=id; render(); },
  level:id=>{ state.level=id; render(); },
  cat:id=>{ state.cat=id; render(); },
  login, doLogin, logout, seed,
  addFile:()=>uploadForm('file'), addVideo:()=>uploadForm('video'),
  bellOpen, bellRead, bellDis, bellDel, trkOpen, trkRefresh:()=>render(), draftClear:()=>{ if(dr){ const r = dr.reopen; drDrop(); if(r) r(true); } }, addQuiz:quizForm, addq:()=>addQBlock(), rmq:(id,el)=>{ el.closest('.qb').remove(); numberQs(); }, saveQuiz,
  addAssign:assignForm, addLink:linkForm,
  delItem, delQuiz, delAssign, delLink, delSub,
  takeQuiz, startQuiz, submitQuiz, results:showResults,
  openSubmit, subs:showSubs, saveGrade,
  preview, close:requestClose,
  addClass:addClassForm, delClass, addStudent:id=>addStudentForm(id), bulkStudents:id=>bulkForm(id),
  resetPw, doResetPw, delStudent, copyCreds, printCreds:()=>window.print(), myPw:changeMyPw, doMyPw,
  jsonSample:downloadSample, rvWrong:()=>setRv(true), rvAll:()=>setRv(false)
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  if(el.dataset.a==='ovclose'){ if(e.target===el && !el.classList.contains('full') && !modalHasText()) requestClose(); return; }
  if(el.dataset.a==='search') return;
  H[el.dataset.a]?.(el.dataset.id, el);
});
document.addEventListener('input', e=>{
  if(e.target.dataset?.a==='search'){
    state.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const s = document.querySelector('[data-a=search]'); if(s){ s.focus(); s.setSelectionRange(pos,pos); }
  }
});

  if(!configured || !window.supabase){
    if(configured){ $('#view').innerHTML = `<div class="setup"><h2>تعذر تحميل مكتبة Supabase</h2><p style="color:var(--muted)">تأكد من اتصالك بالإنترنت ثم أعد تحميل الصفحة.</p></div>`; }
    else renderSetup();
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global:{ fetch: safeFetch } });
  sb.auth.onAuthStateChange((ev, sess) => {
    setTimeout(() => {
      if(((sess && sess.user && sess.user.id) || null) !== state.uid) afterAuth();
    }, 0);
  });
  await afterAuth();
})();
